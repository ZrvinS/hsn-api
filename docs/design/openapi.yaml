  /v1/admin/rate-proposals:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener (HSN_ADMIN_HOST:HSN_ADMIN_PORT); not reachable from the public listener
    post:
      tags: [admin]
      operationId: createRateProposal
      summary: Propose a change (maker)
      description: |
        Creates a `pending` proposal with a server-computed `content_sha256`
        (sha256 of the RFC 8785 canonical JSON of the proposal content). Nothing changes
        in the published data until a *different admin actor* approves it.

        Actions:
        - `create`, `supersede`, `correct` carry a `rule`; `supersede`, `end_date`,
          `verify`, `correct` name the target in `supersedes_rule_id`.
        - `correct` (ruling 1) voids the target and inserts the replacement with any
          `effective_from`, including the target's own first day.
        - `verify` moves an unverified rule to verified, or re-verifies a verified rule
          (refreshes `last_verified_at`, ruling 9). It carries top-level `source`
          `{pdf_sha256, schedule_serial, url?, notification?}`, no `rule` (ruling 36).
        - `end_date` carries `end_date` only (no citation).
        - `refdata_change` (ruling 23) changes one reference row; `refdata` is
          `{table, op, …}` (see `RefdataChange`): add or deactivate a `synonym`,
          `category_map` or `chapter_keyword` row, `update` an `hsn_description`, or
          `add_code` a new `hsn_code` (published with an `hsn_added` feed row).
        - `admin_grant` (ruling 17) carries `grant` `{handle, display_name?, new_actor}`:
          `new_actor: true` creates the actor, `false` authorises an extra admin key for
          the proposer itself (400 `not_self` otherwise); the grant must be redeemed
          within `HSN_ADMIN_GRANT_TTL_HOURS` (≤ 72 h). It publishes no dataset version.
        - `disable_actor` (round 4) carries `disable {handle}`; refused (400
          `last_actors`) if fewer than two active admins would remain. Approval
          disables the actor (its keys get 401 at once) and withdraws its pending
          proposals. A disabled actor's pending proposals cannot be approved (409
          `proposer-disabled`).
        - `dataset_import` (round 5) is the first production data load. It is created
          and approved only with `npm run import-dataset` on the host (see TRD §16);
          it is listed here and can be rejected, but approve returns 409
          `proposal-stale`.
        A field not used by the action is refused (400), as is a missing one.

        `create`, `supersede` and `correct` cite their source in `rule.source`
        `{notification, url, pdf_sha256, schedule_serial}` (00c ruling 35): canonical
        `notification`, an https `url` whose parsed hostname is exactly in
        `HSN_SOURCE_HOSTS` (no userinfo, default port), the PDF's `pdf_sha256` and its
        `schedule_serial`; the `url` must be a notification document (`/view-pdf/` or `.pdf`),
        never an index page (400, ruling 36). `verify` sends `source {pdf_sha256,
        schedule_serial}` plus, on the first verify of an unverified rule, optional `url` and
        `notification`; `url` is required when the rule cites an index page (400
        `source-url-not-document`, ruling 36). Notification references are stored in the
        canonical `N/YYYY` form without zero padding (`01/2026` → `1/2026`).
        A target rule that is not active, already superseded or already end-dated →
        409 `rule-not-active`.
        A change taking effect before today (IST) needs `retroactive_reason` (else 400).
        `Idempotency-Key` is required (missing → 400 `idempotency-key-required`); the
        same key with a different body → 409 `idempotency-conflict`.
      security:
        - apiKey: [admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateProposalCreate' }
            examples:
              supersede:
                summary: Supersede the 3004 12% fixture rule with the 5% general rule (illustrative hash and serial)
                value:
                  action: supersede
                  supersedes_rule_id: rr_01H000000000000000000000B4
                  rule:
                    hsn_prefix: '3004'
                    igst_rate_bp: 500
                    cess: { rate_bp: 0, specific_amount: null, specific_unit: null }
                    condition: { kind: none, text: null, min_unit_price: null, max_unit_price: null }
                    effective_from: '2025-09-22'
                    effective_to: null
                    source:
                      notification: '9/2025-CT(Rate), Schedule I'
                      url: https://taxinformation.cbic.gov.in/view-pdf/1010436/ENG/Notifications
                      schedule_serial: S.No. 0000 (illustrative)
                      pdf_sha256: 9b74c9897bac770ffc029102a200c5de0f2d4e5b8a1c3e6d7f9a0b1c2d3e4f5a
                  rationale: GST rate rationalisation; medicaments in 3004 moved from 12% to 5% from 22 Sep 2025.
              verify:
                summary: Verify the 7113 seed rule against the PDF (illustrative hash and serial)
                value:
                  action: verify
                  supersedes_rule_id: rr_01J9ZK3M7Q8V2X4T6B1N0C5D7E
                  source:
                    schedule_serial: S.No. 0000 (illustrative)
                    pdf_sha256: 9b74c9897bac770ffc029102a200c5de0f2d4e5b8a1c3e6d7f9a0b1c2d3e4f5a
                  rationale: Checked the 3% entry for heading 7113 against the 9/2025 PDF.
              refdata:
                summary: Add a curated synonym (refdata_change)
                value:
                  action: refdata_change
                  refdata: { table: synonym, op: add, phrase: 'gold chain', hsn_code: '7113', strength: primary, note: null, rule_hint: null }
                  rationale: Frequent jeweller term; maps to articles of jewellery.
              addCode:
                summary: Add an HSN code that is missing from the master (refdata_change, add_code)
                value:
                  action: refdata_change
                  refdata: { table: hsn_code, op: add_code, code: '71131920', description: 'Other articles of jewellery of gold, set with stones (illustrative)', keywords: 'gold jewellery studded', type: goods }
                  rationale: Code appears in the current tariff but is missing from the seed master.
              disableActor:
                summary: Disable an admin actor (disable_actor, round 4)
                value:
                  action: disable_actor
                  disable: { handle: ravi }
                  rationale: Ravi left the team; disable his admin actor and keys.
              adminGrant:
                summary: Request an extra admin key for yourself (admin_grant, new_actor false)
                value:
                  action: admin_grant
                  grant: { handle: amit, new_actor: false }
                  rationale: Quarterly rotation of Amit's admin key (proposed by amit).
      responses:
        '201':
          description: Proposal created.
          headers:
            Location:
              description: URL of the new proposal.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateProposal' }
        '400': { $ref: '#/components/responses/AdminBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Conflicts with a published rule or another pending proposal (`overlapping-rule`), the target rule is not active, already superseded or already end-dated (`rule-not-active`), or the Idempotency-Key was reused with a different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://hsn-api.example/problems/overlapping-rule
                title: Overlapping rate rule
                status: 409
                detail: 'Rule for prefix 3004 (no condition) would overlap rr_01H000000000000000000000B4 on 2025-09-22..open. Use action "supersede" with supersedes_rule_id.'
                instance: /v1/admin/rate-proposals
                request_id: req_01J9ZQ4V6W0F3K2H8M5N1P7R9V
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [admin]
      operationId: listRateProposals
      summary: List proposals
      security:
        - apiKey: [admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, withdrawn], default: pending }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Page of proposals.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [proposals, next_cursor]
                properties:
                  proposals:
                    type: array
                    items: { $ref: '#/components/schemas/RateProposal' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/rate-proposals/{id}:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    get:
      tags: [admin]
      operationId: getRateProposal
      summary: Read one proposal, including the content_sha256 the checker must send back
      description: |
        Returns the proposal in the code's shape (00c ruling 34): `content_sha256`, the
        current state of the target rule (`target_rule`, for actions that name one),
        `retroactive`, the rule (`rule`) or the action's `payload`, and the actor handles
        `proposed_by` / `decided_by`. The checker reviews this response and sends its
        `content_sha256` as `expected_sha256` on approve or reject.
      security:
        - apiKey: [admin]
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: The proposal.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateProposal' }
              example:
                id: rp_01J9ZR0000000000000000000A
                status: pending
                action: supersede
                supersedes_rule_id: rr_01H000000000000000000000B4
                target_rule: { rule_id: rr_01H000000000000000000000B4, hsn_prefix: '3004', igst_rate_bp: 1200, igst_rate_percent: 12, condition_kind: none, condition_text: null, effective_from: '2017-07-01', effective_to: null, status: active, verification_status: unverified, notification: '1/2017-IT(Rate)' }
                end_date: null
                rule:
                  hsn_prefix: '3004'
                  igst_rate_bp: 500
                  cess: { rate_bp: 0, specific_amount: null, specific_unit: null }
                  condition: { kind: none, code: null, text: null, min_unit_price: null, max_unit_price: null }
                  effective_from: '2025-09-22'
                  effective_to: null
                  source:
                    notification: '9/2025-CT(Rate), Schedule I'
                    url: https://taxinformation.cbic.gov.in/view-pdf/1010436/ENG/Notifications
                    pdf_sha256: 9b74c9897bac770ffc029102a200c5de0f2d4e5b8a1c3e6d7f9a0b1c2d3e4f5a
                    schedule_serial: S.No. 0000 (illustrative)
                payload: null
                rationale: GST rate rationalisation; medicaments in 3004 moved from 12% to 5% from 22 Sep 2025.
                retroactive: true
                retroactive_reason: Rate change from 22 Sep 2025 published late; backfilling the supersession.
                content_sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                proposed_by: amit
                proposed_at: '2026-10-02T11:20:00Z'
                decided_by: null
                decided_at: null
                decision_comment: null
                resulting_rule_id: null
                resulting_dataset_version: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/rate-proposals/{id}/approve:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    post:
      tags: [admin]
      operationId: approveRateProposal
      summary: Approve one proposal (checker) and publish
      description: |
        One proposal per call; there is no bulk approval. In one transaction (data-model
        §4.1): the approving key and actor are re-read from the DB (no auth cache;
        revocation is immediate); `403 maker-checker-violation` when the approving
        `actor_id` equals the proposer's; `409 proposal-hash-mismatch` when
        `expected_sha256` ≠ the proposal's `content_sha256`, or when the stored content no
        longer hashes to its `content_sha256` (edited in the database; round 6, SA-C3-01); `409 rule-not-active` when
        the target rule no longer exists or changed after the proposal was made (00c
        ruling 35); `409 proposal-stale` when the change has become retroactive without
        a `retroactive_reason`, a reference row changed meanwhile, a granted actor
        was created meanwhile, or the proposal is a `dataset_import` (approve it with
        `scripts/import-dataset.ts` on the host, which re-hashes the files);
        `409 proposer-disabled` when the proposer's actor has been disabled (round 4); `409 overlapping-rule`; `409 proposal-not-pending` when the
        proposal is not pending. A replay with the same `Idempotency-Key` and body
        within 24 h returns 200 with the stored response; any other approve of a
        non-pending proposal returns 409 `proposal-not-pending`.

        On success the action is applied (rule inserted as `verified`, target end-dated,
        voided or verified, reference row changed, or admin grant recorded), a new
        dataset version is sealed (not for `admin_grant`), change-feed rows are appended,
        an HMAC-chained audit entry with the full canonical rule rows is written, and a
        log line is emitted (`admin.grant_approved` at warn level with `alert: true` for
        `admin_grant`; there is no out-of-band notifier in v1, ruling 29).
      security:
        - apiKey: [admin]
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_sha256, verified_against_source]
              properties:
                expected_sha256: { $ref: '#/components/schemas/Sha256Hex' }
                verified_against_source:
                  type: boolean
                  const: true
                  description: Checker attests they opened the cited PDF, confirmed its sha256 and schedule serial, and confirmed the content.
                comment: { type: string, maxLength: 1000 }
            example: { expected_sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae, verified_against_source: true, comment: 'Checked 9/2025-CT(Rate) Schedule I entry for 3004.' }
      responses:
        '200':
          description: 'Approved and published (or an idempotent replay of that response, with `Idempotent-Replayed: true`).'
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateProposal' }
        '400': { $ref: '#/components/responses/AdminBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Missing admin scope (`insufficient-scope`), or maker–checker violation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://hsn-api.example/problems/maker-checker-violation
                title: Approver must differ from proposer
                status: 403
                detail: 'Proposal rp_01J9ZR0000000000000000000A was created by actor act_01J9ZP0000000000000000000A; a different admin actor must approve it.'
                instance: /v1/admin/rate-proposals/rp_01J9ZR0000000000000000000A/approve
                request_id: req_01J9ZQ4V6W0F3K2H8M5N1P7R9W
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`proposal-not-pending`, `proposal-hash-mismatch`, `rule-not-active`, `proposal-stale`, `proposer-disabled`, `overlapping-rule` or `idempotency-conflict`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://hsn-api.example/problems/proposal-hash-mismatch
                title: Proposal content differs from what was reviewed
                status: 409
                detail: 'expected_sha256 does not match proposal rp_01J9ZR0000000000000000000A. Re-read the proposal and review it again.'
                instance: /v1/admin/rate-proposals/rp_01J9ZR0000000000000000000A/approve
                request_id: req_01J9ZQ4V6W0F3K2H8M5N1P7RA6
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/rate-proposals/{id}/reject:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    post:
      tags: [admin]
      operationId: rejectRateProposal
      summary: Reject one proposal (checker)
      description: Same maker–checker, `expected_sha256` (including the stored-content re-hash, 409 `proposal-hash-mismatch`), idempotency and not-pending rules as approve.
      security:
        - apiKey: [admin]
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_sha256, reason]
              properties:
                expected_sha256: { $ref: '#/components/schemas/Sha256Hex' }
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200':
          description: Rejected.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateProposal' }
        '400': { $ref: '#/components/responses/AdminBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`proposal-not-pending`, `proposal-hash-mismatch` or `idempotency-conflict`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/rate-proposals/{id}/withdraw:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    post:
      tags: [admin]
      operationId: withdrawRateProposal
      summary: Withdraw one's own pending proposal (maker)
      description: |
        Ruling 26. Body `{reason}` (5–1000 characters). Maker-only (the caller's
        actor must be the proposer, else 403 `not-proposer`) and pending-only (else 409
        `proposal-not-pending`). Audited `rate_proposal.withdrawn`.
        Revoking an admin key or disabling an actor withdraws that actor's pending
        proposals automatically (audited as `system`).
      security:
        - apiKey: [admin]
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200':
          description: Withdrawn.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateProposal' }
        '400': { $ref: '#/components/responses/AdminBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Missing admin scope, or the caller is not the proposer (`not-proposer`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`proposal-not-pending` or `idempotency-conflict`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/products/{gtin}:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    delete:
      tags: [admin]
      operationId: purgeCachedProduct
      summary: Purge one cached barcode product (admin)
      description: |
        Deletes the `products` cache row for this GTIN (for example after an Open Food
        Facts record was found to be poisoned), and clears its in-memory error-cache
        entry. The next classify request for it fetches the product again. Audited as
        `product.purged` (entity_type `product`) with the removed row's `source`,
        `found` and `fetched_at`. Does not change any rate or reference data, so it needs no
        maker–checker; it is audited (no out-of-band notifier in v1; ruling 29).
      security:
        - apiKey: [admin]
      parameters:
        - name: gtin
          in: path
          required: true
          description: GTIN-8/12/13/14, digits only (normalised to GTIN-14; checksum validated, else 422 invalid-gtin).
          schema: { type: string, pattern: '^(\d{8}|\d{12}|\d{13}|\d{14})$' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Purged (or an idempotent replay). 00c ruling 34.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema:
                type: object
                required: [gtin, deleted]
                properties:
                  gtin: { type: string, pattern: '^\d{14}$', description: 'Normalised GTIN-14.' }
                  deleted: { type: boolean, const: true }
              example: { gtin: '04006381333931', deleted: true }
        '400': { $ref: '#/components/responses/AdminBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`not-found`: no row is cached for this GTIN.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`invalid-gtin`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/watched-notifications:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    get:
      tags: [admin]
      operationId: listWatchedNotifications
      summary: List open watched notifications (state detected)
      description: |
        Rows found by the CBIC watcher (`source: cbic_watcher`, empty
        `affected_prefixes` until triage) and rows entered by hand (`source: manual`).
        Daily loop: check `GET /v1/admin/watcher/status`, list these rows, open each
        `source_url`, triage it, create rate proposals for the change, and resolve the
        row once they are published (or dismiss it).
      security:
        - apiKey: [admin]
      responses:
        '200':
          description: Open rows, oldest first.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/WatchedNotification' }
              example:
                notifications:
                  - id: wn_01JA0C0000000000000000000A
                    notification_ref: '1/2026-CT(Rate)'
                    source_url: https://cbic-gst.gov.in/central-tax-rate.html
                    affected_prefixes: []
                    effective_from: null
                    detected_at: '2026-10-10T06:17:04Z'
                    state: detected
                    expedite: false
                    note: null
                    created_by: 'system:cbic-watcher'
                    resolved_at: null
                    resolved_by: null
                    source: cbic_watcher
                    notification_key: 'central_tax_rate:1/2026'
                    title: Seeks to amend notification No. 1/2017-Central Tax (Rate) (illustrative)
                    notification_date: '2026-10-09'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [admin]
      operationId: createWatchedNotification
      summary: Record a notification by hand (manual watcher entry)
      description: |
        Creates a `detected` row with `source: manual` and audits
        `watched_notification.detected`. The server derives the same
        `notification_key` the watcher would, so a notification that is already watched
        (by hand or by the watcher) returns 409 `duplicate-notification`. `url` must pass
        the same source-URL check as proposals (`HSN_SOURCE_HOSTS`, https, default port,
        no userinfo). Never changes a rate.
      security:
        - apiKey: [admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchedNotificationCreate' }
            example: { notification: '2/2026-CT(Rate)', url: 'https://taxinformation.cbic.gov.in/view-pdf/<id>', affected_prefixes: ['2202'], effective_from: '2026-11-01', expedite: false, note: 'Seen on the CBIC site before the watcher run.' }
      responses:
        '201':
          description: Created (or an idempotent replay).
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchedNotification' }
        '400': { $ref: '#/components/responses/AdminBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`duplicate-notification` or `idempotency-conflict`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://hsn-api.example/problems/duplicate-notification
                title: Notification is already being watched
                status: 409
                detail: '2/2026-CT(Rate) is already watched (wn_01JA0C0000000000000000000B).'
                instance: /v1/admin/watched-notifications
                request_id: req_01JA0C4V6W0F3K2H8M5N1P7R9A
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: '`admin-writes-disabled` or `dataset-not-loaded`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/watched-notifications/{id}/triage:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    post:
      tags: [admin]
      operationId: triageWatchedNotification
      summary: Set the HSN/SAC prefixes a detected notification affects
      description: |
        Only while the row is `detected` (else 404 `not-found`). Sets
        `affected_prefixes` (1–200 unique prefixes of 2, 4, 6 or 8 digits or a 5-digit
        SAC group) and optionally `effective_from`; from then on lookups of codes under
        those prefixes carry `pending_change_detected` (ruling 10). Audited
        `watched_notification.triaged` with the previous prefixes. Never changes a rate.

        **Two admins (rounds 4 and 6, SA-C2-03, SA-C3-03).** On a row that carries a CBIC
        `notification_key` (every `cbic_watcher` row, and manual rows whose notification
        parses to a key), the **first** triage (setting prefixes on an untriaged row) and
        any triage that **removes** prefixes is first stored as `pending_action`
        (audited `watched_notification.confirmation_requested`) and returns **202**
        with the row; the same request from a *different* admin applies it (audited
        with `requested_by` and `confirmed_by`, warn log `watcher.row_silenced`). The
        same actor confirming, even with another key, gets 403
        `maker-checker-violation`; a different request replaces the pending one.
        Later additions of prefixes, and manual rows without a notification key, stay
        single-admin. The database trigger refuses a direct change (schema v7).
      security:
        - apiKey: [admin]
      parameters:
        - $ref: '#/components/parameters/WatchedNotificationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [affected_prefixes]
              properties:
                affected_prefixes:
                  type: array
                  minItems: 1
                  maxItems: 200
                  uniqueItems: true
                  items: { type: string, pattern: '^(\d{2}|\d{4}|99\d{3}|\d{6}|\d{8})$' }
                effective_from: { type: string, format: date }
            example: { affected_prefixes: ['2202', '220299'], effective_from: '2026-11-01' }
      responses:
        '202':
          description: First triage, or removal of prefixes, on a keyed row stored as `pending_action`; a second admin must repeat it.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchedNotification' }
        '200':
          description: Triaged row (or an idempotent replay).
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchedNotification' }
        '400': { $ref: '#/components/responses/AdminBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`idempotency-conflict`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/watched-notifications/{id}/resolve:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    post:
      tags: [admin]
      operationId: resolveWatchedNotification
      summary: Close a detected notification as published or dismissed
      description: |
        Only while the row is `detected` (else 404 `not-found`). After this the row is
        immutable. Audited `watched_notification.published` or
        `watched_notification.dismissed`.

        **Two admins for keyed rows (rounds 4 and 6, SA-C2-03, SA-C3-03).** Resolving a
        row that carries a CBIC `notification_key` (every `cbic_watcher` row, and a manual
        row whose notification parses to a key) turns its warnings and SLA alert off, so
        the first request is stored as `pending_action` and returns **202** with the row;
        a *different* admin repeating it applies it (403 `maker-checker-violation` for
        the same actor). Manual rows without a notification key resolve in one step.
      security:
        - apiKey: [admin]
      parameters:
        - $ref: '#/components/parameters/WatchedNotificationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { type: string, enum: [published, dismissed] }
            example: { state: published }
      responses:
        '202':
          description: First admin's request on a keyed row, stored as `pending_action`; a second admin must repeat it.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchedNotification' }
        '200':
          description: Closed row (or an idempotent replay).
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchedNotification' }
        '400': { $ref: '#/components/responses/AdminBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/watcher/status:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    get:
      tags: [admin]
      operationId: getWatcherStatus
      summary: CBIC watcher health and the freshness alert inputs
      description: |
        `freshness.alert` is true when the last successful run is older than 36 hours
        (or there has never been one: `watcher_stale`), or when a detected row has been
        open for more than 2 business days (Mon–Fri IST; Indian public holidays are not
        modelled) and is listed in `overdue_notifications`. `untriaged` counts open rows
        with no `affected_prefixes`.
      security:
        - apiKey: [admin]
      responses:
        '200':
          description: Watcher status.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatcherStatus' }
              example:
                freshness:
                  checked_at: '2026-10-10T09:00:00Z'
                  sources_checked_at: '2026-10-10T06:17:09Z'
                  hours_since_success: 2.7
                  watcher_stale: false
                  alert: false
                  reasons: []
                  overdue_notifications: []
                last_run: { id: 412, started_at: '2026-10-10T06:17:01Z', finished_at: '2026-10-10T06:17:09Z', status: ok, items_seen: 38, items_new: 1, error: null }
                recent_runs:
                  - { id: 412, started_at: '2026-10-10T06:17:01Z', finished_at: '2026-10-10T06:17:09Z', status: ok, items_seen: 38, items_new: 1, error: null }
                  - { id: 411, started_at: '2026-10-10T00:17:01Z', finished_at: '2026-10-10T00:17:04Z', status: failed, items_seen: 0, items_new: 0, error: 'central_tax_rate: shape_changed' }
                untriaged: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/audit:
    servers:
      - url: http://127.0.0.1:3001
        description: Admin listener
    get:
      tags: [admin]
      operationId: listAudit
      summary: Read the append-only, HMAC-chained audit log
      description: |
        Ruling 27. `verify=true` recomputes the HMAC chain (with `HSN_AUDIT_KEY`) over
        the span from the entry before `after_id` to the last returned entry and reports
        `chain_ok` and, on failure, `chain_broken_at` (the first bad id). When the span
        exceeds 10,000 entries (for example a filtered page) it is not verified:
        `chain_ok` is null and `verify_note` says to use `scripts/verify-audit.ts`.
        `verify=false` (default) returns `chain_ok: null`. Every response carries
        `head_id` / `head_hash` (the newest entry), to compare with the exported
        off-host head. Truncation of the tail or a wholesale rewrite is detected only
        by `scripts/verify-audit.ts --head <file>` (nightly and in every restore drill),
        not by this endpoint.
      security:
        - apiKey: [admin]
      parameters:
        - name: after_id
          in: query
          schema: { type: integer, minimum: 0, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: entity_type
          in: query
          schema: { type: string, enum: [rate_rule, rate_proposal, dataset_version, api_key, synonym, admin_actor, watched_notification, product] }
        - name: verify
          in: query
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: Audit entries, ascending id.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
              example:
                entries:
                  - id: 5120
                    at: '2026-10-03T09:15:02Z'
                    actor: priya
                    key_prefix: hsk_7fA3kQ2z
                    action: rate_proposal.approved
                    entity_type: rate_proposal
                    entity_id: rp_01J9ZR0000000000000000000A
                    details:
                      proposal_content_sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                      dataset_version: '2026.10.03-1'
                      dataset_content_sha256: 5d41402abc4b2a76b9719d911017c592ae2f1c0b3a7d0e9f8c6b5a4d3e2f1a0b
                      rules:
                        - { rule_id: rr_01J8B0000000000000000000B5, rule_sha256: 8f434346648f6b96df89dda901c5176b10a6d83961dd3c1ac88b59b2dc327aa4, row: { hsn_prefix: '3004', igst_rate_bp: 500, effective_from: '2025-09-22' } }
                    prev_hash: 9f2c1e0d4b7a6c5e8d3f2a1b0c9e8d7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d
                    hash: 3ab8e64f02c1d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4
                next_after_id: 5120
                head_id: 5131
                head_hash: 0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d
                chain_ok: true
                chain_broken_at: null
                verify_note: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: 'hsk_<8-char prefix>_<43-char base64url secret>'
      description: |
        `Authorization: Bearer hsk_ab12cd34_<secret>`. The secret is 32 random bytes,
        base64url-encoded (43 chars). The server looks up the key by its prefix and
        compares HMAC-SHA256(secret, pepper[pepper_id]) with the stored hash in constant
        time. Every request re-reads the key row: there is no auth cache, so revocation
        and expiry take effect immediately.

        Scopes (role names, per OpenAPI 3.1 for non-OAuth schemes): `read` (lookup,
        search, tax, feed, meta), `classify` (POST /v1/classify), `admin` (all
        /v1/admin/*, admin listener only). A client key holds `read`, `classify` or
        both. `admin` is never combined with another scope; an admin key is bound to one
        admin actor (`actor_id`), expires within 90 days, and after bootstrap is issued
        only against an approved `admin_grant` proposal (two-person rule). Scopes are not
        hierarchical; unknown scope values are rejected.

  parameters:
    HsnCode:
      name: code
      in: path
      required: true
      description: HSN/SAC code, digits only, of length 2, 4, 6 or 8, or 5 for SAC groups in chapter 99 (e.g. 99972). Spaces and dots are not accepted.
      schema: { $ref: '#/components/schemas/HsnCodeString' }
      example: '7113'
    AsOfDate:
      name: date
      in: query
      description: Resolve rates applicable on this date (Asia/Kolkata). Default today IST. Earliest 2017-07-01.
      schema: { type: string, format: date }
      example: '2025-09-01'
    UnitPrice:
      name: unit_price
      in: query
      description: Price per unit/piece in INR (≤ 2 decimals) used to resolve price-threshold rules.
      schema: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.01 }
      example: 1800.00
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag from a previous response; returns 304 if unchanged.
      schema: { type: string, maxLength: 128 }
      example: 'W/"ds-2026.10.03-1-7c1e2a9b04d3f5a6"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID, required on every admin write (ruling 28; missing →
        400 `idempotency-key-required`). Stored per `(key_id, Idempotency-Key)` for 24 h
        with the request hash and response: the same key and body returns the stored
        response with `Idempotent-Replayed: true`; the same key with a different body →
        409 `idempotency-conflict`.
      schema: { type: string, format: uuid, maxLength: 64 }
    ProposalId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^rp_[0-9A-HJKMNP-TV-Z]{26}$' }
    WatchedNotificationId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^wn_[0-9A-HJKMNP-TV-Z]{26}$' }
    XRequestId:
      name: X-Request-Id
      in: header
      description: Optional client correlation id. When it matches `^[A-Za-z0-9._-]{1,64}$` it is echoed as `client_request_id` in problems and logs; otherwise it is ignored. It never replaces the server's `request_id`.
      schema: { type: string, maxLength: 64 }

  headers:
    ETag:
      description: Weak validator `W/"ds-<dataset_version>-<first 16 hex of sha256(dataset_version, resolved as-of date in IST, response body)>"`. Changes when the dataset version, the IST date or the body changes.
      schema: { type: string }
      example: 'W/"ds-2026.10.03-1-7c1e2a9b04d3f5a6"'
    CacheControlLookup:
      description: '`private, max-age=<n>, must-revalidate` where n = min(3600, seconds until the next IST midnight).'
      schema: { type: string }
      example: 'private, max-age=3600, must-revalidate'
    CacheControlNoCache:
      description: '`private, no-cache` (always revalidate with If-None-Match).'
      schema: { type: string, const: 'private, no-cache' }
    CacheControlNoStore:
      description: '`no-store`.'
      schema: { type: string, const: no-store }
    XRequestId:
      description: The server's request id (`req_` ULID), equal to `request_id` in problems and logs.
      schema: { type: string, pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$' }
    RateLimitLimit:
      description: Tokens per minute for this key (`rate_limit_per_min`, default 600; refill limit/60 tokens per second; burst capacity ceil(limit/6), see RateLimit-Policy).
      schema: { type: integer }
      example: 600
    RateLimitRemaining:
      description: Tokens left in the bucket after this request (floored).
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the bucket is full again.
      schema: { type: integer }
    RateLimitCost:
      description: Tokens this request cost (classify 5; tax 1 + floor(lines/50); others 1).
      schema: { type: integer }
    RateLimitPolicy:
      description: 'Bucket policy: limit per window and burst capacity in tokens.'
      schema: { type: string }
      example: '600;w=60;burst=100'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }
    IdempotentReplayed:
      description: '`true` when this response is the stored response of an earlier request with the same Idempotency-Key and body.'
      schema: { type: string, enum: ['true'] }

  responses:
    NotModified:
      description: Resource unchanged since the supplied ETag.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
    BadRequest:
      description: 'Request failed schema validation. `errors[]` lists every failing field pointer and constraint name (up to 50; the total is in `detail`); free-text values are never echoed. Example: live output, quick-start seed, 2026-10-11 (three tax lines without `supply_type`; 501 lines; 60 unknown keys).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            threeErrors:
              summary: "Three tax lines without supply_type (live output, quick-start seed, 2026-10-11)"
              value:
                type: https://hsn-api.example/problems/validation-failed
                title: Request validation failed
                status: 400
                instance: /v1/tax/calculate
                request_id: req_01M4PBGZNXE6AQ281PAYNHY3WY
                code: validation_failed
                detail: 'Request validation failed: 3 problems. See errors[].'
                errors:
                - pointer: /lines/0/supply_type
                  code: required
                  message: Required
                - pointer: /lines/1/supply_type
                  code: required
                  message: Required
                - pointer: /lines/2/supply_type
                  code: required
                  message: Required
            maxItems:
              summary: "501 lines: one maxItems error for the array (structural guard, before Ajv) (live output, quick-start seed, 2026-10-11)"
              value:
                type: https://hsn-api.example/problems/validation-failed
                title: Request validation failed
                status: 400
                instance: /v1/tax/calculate
                request_id: req_01M4PBHSETRZ0E3AP1YX2C2C7P
                code: validation_failed
                detail: 'Request validation failed: 1 problem. See errors[].'
                errors:
                - pointer: /lines
                  code: maxItems
                  message: Has 501 items; at most 500 are allowed
            unknownKeys:
              summary: "60 unknown top-level keys: 50 errors, the total in detail (errors trimmed to 3 here) (live output, quick-start seed, 2026-10-11)"
              value:
                type: https://hsn-api.example/problems/validation-failed
                title: Request validation failed
                status: 400
                instance: /v1/tax/calculate
                request_id: req_01M4PBHSFW8PEQNSQ8CY5BBXEV
                code: validation_failed
                detail: 'Request validation failed: 60 problems; the first 50 are in errors[].'
                errors:
                - pointer: /x0
                  code: additionalProperties
                  message: Unknown field is not allowed
                - pointer: /x1
                  code: additionalProperties
                  message: Unknown field is not allowed
                - pointer: /x2
                  code: additionalProperties
                  message: Unknown field is not allowed
    AdminBadRequest:
      description: '`validation-failed`, `idempotency-key-required` when the Idempotency-Key header is missing (ruling 28), or `source-url-not-document` (ruling 36).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            idempotencyKeyRequired:
              summary: Missing Idempotency-Key header
              value:
                type: https://hsn-api.example/problems/idempotency-key-required
                title: Idempotency-Key header required
                status: 400
                detail: 'Admin writes require an Idempotency-Key header (a UUID).'
                instance: /v1/admin/rate-proposals
                request_id: req_01JA0C4V6W0F3K2H8M5N1P7R9B
            sourceUrlNotDocument:
              summary: "Verify of the 3004 nil rule, which cites the CBIC index page, without source.url (live output, quick-start seed, 2026-10-11)"
              value:
                type: https://hsn-api.example/problems/source-url-not-document
                title: The rule cites an index page; verify needs the notification document URL
                status: 400
                instance: /v1/admin/rate-proposals
                request_id: req_01M4PBGZZY8SP5ES581J4Z28H4
                code: source_url_not_document
                detail: Rule rr_XC755EY7H2Q8ZDAXNB33FREDCZ cites https://cbic-gst.gov.in/central-tax-rate.html, a listing/index page, not the notification document. Send source.url (the notification PDF you checked) with this verify (ruling 36).
                errors:
                - pointer: /source/url
                  code: required
                  message: 'Required: the rule currently cites an index page'
            notificationPattern:
              summary: "Verify with a free-text source.notification (live output, quick-start seed, 2026-10-11)"
              value:
                type: https://hsn-api.example/problems/validation-failed
                title: Request validation failed
                status: 400
                instance: /v1/admin/rate-proposals
                request_id: req_01M4PBJBF2NFBQ28H48GFN66HF
                code: validation_failed
                detail: 1 field is invalid. See errors[].
                errors:
                - pointer: /source/notification
                  code: pattern
                  message: '"Notification 9 of 2025, central tax" is not a notification citation. Use the canonical form <n>/<yyyy>-<CT|IT|UTT|Cess>(Rate)[, Schedule <I–VII>], e.g. "9/2025-CT(Rate), Schedule IV"'
    Unauthorized:
      description: Missing, malformed, unknown, expired or revoked API key (identical response in every case).
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: 'Bearer realm="hsn-api", error="invalid_token"'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://hsn-api.example/problems/unauthenticated
            title: API key missing or invalid
            status: 401
            detail: 'Send "Authorization: Bearer <key>". Keys look like hsk_xxxxxxxx_…'
            instance: /v1/hsn/7113
            request_id: req_01J9ZQ4V6W0F3K2H8M5N1P7R9Y
    Forbidden:
      description: Key lacks the required scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://hsn-api.example/problems/insufficient-scope
            title: API key lacks a required scope
            status: 403
            detail: 'POST /v1/classify needs scope "classify"; key hsk_ab12cd34 has [read].'
            instance: /v1/classify
            request_id: req_01J9ZQ4V6W0F3K2H8M5N1P7R9Z
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HsnNotFound:
      description: The code's chapter does not exist in the current dataset (a code with a known ancestor resolves under it instead).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://hsn-api.example/problems/hsn-not-found
            title: HSN/SAC code not found
            status: 404
            detail: 'No HSN/SAC "0012" in dataset 2026.10.11-1, and chapter 00 does not exist. Try GET /v1/hsn/search?q=….'
            instance: /v1/hsn/0012
            request_id: req_01J9ZQ4V6W0F3K2H8M5N1P7RA0
    PayloadTooLarge:
      description: Body exceeds its limit (64 KiB; classify 16 KiB; tax 256 KiB). A tax request with more than 500 lines is a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Content-Type must be application/json.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Per-key token bucket empty (`rate-limited`) or daily quota exceeded (`quota-exceeded`).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        RateLimit-Cost: { $ref: '#/components/headers/RateLimitCost' }
        RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://hsn-api.example/problems/rate-limited
            title: Too many requests
            status: 429
            detail: 'Key hsk_ab12cd34 has a 600-token bucket refilled at 10 tokens/s; this request costs 5. Retry in 1 s, or cache with ETag / the change feed.'
            instance: /v1/classify
            request_id: req_01J9ZQ4V6W0F3K2H8M5N1P7RA1
    ServiceUnavailable:
      description: Not ready. The detail is generic; which check failed is logged server-side only.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://hsn-api.example/problems/not-ready
            title: Service not ready
            status: 503
            detail: 'The service is not ready to serve traffic.'
            instance: /readyz
            request_id: req_01J9ZQ4V6W0F3K2H8M5N1P7RA2
    InternalError:
      description: Unexpected error. Details are logged server-side under request_id; never echoed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://hsn-api.example/problems/internal
            title: Internal error
            status: 500
            detail: 'Something failed on our side. Quote request_id when reporting.'
            instance: /v1/hsn/7113
            request_id: req_01J9ZQ4V6W0F3K2H8M5N1P7RA3

  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details, with extension members `request_id`,
        `client_request_id`, `code` (server machine code) and `errors`.
        Registered `type` suffixes (kebab-case; the same list as ui-and-dx.md §1 and
        best-practices §3): validation-failed (400), idempotency-key-required (400),
        source-url-not-document (400, ruling 36),
        unauthenticated (401),
        insufficient-scope (403), forbidden-ip (403), maker-checker-violation (403),
        not-proposer (403), hsn-not-found (404), not-found (404), proposal-not-found (404),
        method-not-allowed (405, with an `Allow` header), overlapping-rule (409), proposal-not-pending (409),
        proposal-hash-mismatch (409), proposal-stale (409), rule-not-active (409),
        proposer-disabled (409),
        idempotency-conflict (409), duplicate-notification (409), feed-window-expired (410), payload-too-large (413),
        unsupported-media-type (415), invalid-gtin (422), unknown-hsn (422),
        rule-choice-invalid (422), rate-limited (429), quota-exceeded (429),
        internal (500), not-ready (503), dataset-not-loaded (503),
        classifier-unavailable (503), admin-writes-disabled (503).
      required: [type, title, status, detail, instance, request_id]
      properties:
        type: { type: string, format: uri, description: 'Stable URI ending in a kebab-case suffix, e.g. https://hsn-api.example/problems/hsn-not-found. Clients switch on this, never on title/detail.' }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: 'May echo values that passed a strict format check (digit-only codes that matched the pattern, ids); never free text such as name or q, and never a GTIN that failed its check digit.' }
        instance: { type: string, description: 'The request path (no query string), e.g. /v1/hsn/7113.' }
        request_id: { type: string, pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$', description: 'Server-generated, always.' }
        client_request_id: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$', description: 'The client''s X-Request-Id, when sent and valid.' }
        code: { type: string, pattern: '^[a-z]+(_[a-z]+)*$', description: 'Server machine code (snake_case, e.g. invalid_gtin; not always the same words as the type suffix). Convenience only: clients switch on type.' }
        errors:
          type: array
          maxItems: 50
          description: 'Every problem found (request validation runs with allErrors since core round 9), one entry per pointer and constraint, at most 50 and at most 12 KiB of JSON, so the problem body stays under 16 KiB. `detail` gives the total, e.g. "Request validation failed: 3 problems. See errors[]." or "…: 72 problems; the first 50 are in errors[]." Before Ajv a structural guard (core round 10, SA-C5-01) refuses an array over its maxItems with one `maxItems` error for that array (its items are not inspected) and a body with more than 50 unknown keys with 50 `additionalProperties` errors. Echoed property names are RFC 6901 escaped (~0, ~1) and cut to 64 characters; each pointer is at most 256 characters.'
          items:
            type: object
            required: [pointer, code, message]
            properties:
              pointer: { type: string, description: 'RFC 6901 JSON Pointer into the request (path/query params use /<name>).' }
              code: { type: string }
              message: { type: string }

    Disclaimer:
      type: string
      description: Human-readable honesty statement; always present on rate-bearing responses.

    HsnCodeString:
      type: string
      description: Digits only; length 2, 4, 6 or 8, or 5 in chapter 99 (SAC groups).
      pattern: '^(\d{2}|\d{4}|\d{6}|\d{8}|99\d{3})$'

    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'

    RuleId:
      type: string
      pattern: '^rr_[0-9A-HJKMNP-TV-Z]{26}$'

    ActorId:
      type: string
      pattern: '^act_[0-9A-HJKMNP-TV-Z]{26}$'

    Source:
      type: object
      required: [notification, url, schedule_serial, pdf_sha256]
      properties:
        notification: { type: string, minLength: 1, maxLength: 200, description: 'Canonical notification_ref (core round 10, enforced at every entry point): after normalisation it must match `^[1-9][0-9]{0,3}/(19|20)[0-9]{2}-(CT|IT|UTT|Cess)\(Rate\)(, Schedule (I|II|III|IV|V|VI|VII))?$`, e.g. "9/2025-CT(Rate), Schedule IV". Normalisation strips zero padding, collapses whitespace and rewrites the long series names (Central Tax (Rate), Integrated Tax (Rate), Union Territory Tax (Rate), (Compensation) Cess (Rate), CT (Rate)) to the short form: "09/2025-Central Tax (Rate), Schedule I" is stored as "9/2025-CT(Rate), Schedule I". Anything else → 400 validation-failed, code pattern. The schedule serial goes in schedule_serial, never here. Applies to the seed loader, import-dataset and every proposal input (data-model §1).' }
        url: { type: string, format: uri, pattern: '^https://', maxLength: 500, description: 'https only; on proposals the parsed hostname (lowercased, no trailing dot, ASCII) must be exactly one of HSN_SOURCE_HOSTS (cbic-gst.gov.in, taxinformation.cbic.gov.in, cbic.gov.in, egazette.gov.in, gstcouncil.gov.in), with no userinfo and the default port, and the path must point to the specific notification document.' }
        schedule_serial: { type: [string, 'null'], maxLength: 64, description: 'Serial number inside the schedule, e.g. "S.No. 3". Required on proposals; null on unverified seed rules until their verify proposal.' }
        pdf_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'sha256 of the notification PDF the reviewer read. Required on proposals; null on unverified seed rules until their verify proposal.' }

    Cess:
      type: object
      required: [rate_bp, specific_amount, specific_unit]
      properties:
        rate_bp: { type: integer, minimum: 0, maximum: 30000, description: 'Ad-valorem compensation cess in basis points.' }
        specific_amount: { type: [number, 'null'], multipleOf: 0.01, description: 'INR per specific_unit, if a specific cess applies. Returned as data only; not computed by /v1/tax/calculate in v1.' }
        specific_unit: { type: [string, 'null'], examples: ['1000 sticks', 'tonne'] }

    Condition:
      type: object
      required: [kind, text, min_unit_price, max_unit_price]
      properties:
        kind:
          type: string
          enum: [none, price, other]
          description: '`price` rules are resolved automatically by unit_price; `other` rules (end-use conditions, named lists such as nil-rated drugs) always need a human and make the result ambiguous when more than one rule remains. A `none` rule may coexist with `other` rules (general rule plus conditions); it is then `default_rule_id`.'
        code: { type: [string, 'null'], description: 'Machine condition code from the server''s CONDITION_CODES list (v1: nil_rate_list), or null. Synonym rule_hints select by this code (ruling 5).' }
        text: { type: [string, 'null'], maxLength: 500 }
        min_unit_price: { type: [number, 'null'], minimum: 0, maximum: 1000000000, description: 'Inclusive lower bound, INR, at most 2 decimals (checked on the decimal string, not by float division).' }
        max_unit_price: { type: [number, 'null'], minimum: 0, maximum: 1000000000, description: 'Inclusive upper bound, INR, at most 2 decimals (checked on the decimal string, not by float division).' }

    RateRule:
      type: object
      description: An active published rule. Voided rules are never returned by resolution; they stay in the database and audit log and appear in the feed as `related_rule_id`.
      required: [rule_id, hsn_prefix, igst_rate_bp, igst_rate_percent, cgst_rate_percent, sgst_rate_percent, cess, condition, effective_from, effective_to, source, verification_status, last_verified_at, verified_by, reverify_due_at, dataset_version]
      properties:
        rule_id: { $ref: '#/components/schemas/RuleId' }
        hsn_prefix: { $ref: '#/components/schemas/HsnCodeString' }
        igst_rate_bp: { type: integer, minimum: 0, maximum: 10000, description: 'IGST in basis points (300 = 3%). CGST = SGST (or UTGST) = igst/2.' }
        igst_rate_percent: { type: number }
        cgst_rate_percent: { type: number }
        sgst_rate_percent: { type: number, description: 'Also the UTGST rate for intra_ut supplies.' }
        cess: { $ref: '#/components/schemas/Cess' }
        condition: { $ref: '#/components/schemas/Condition' }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date, description: 'Inclusive; null = open-ended.' }
        source: { $ref: '#/components/schemas/Source' }
        verification_status:
          type: string
          enum: [verified, unverified]
          description: '`unverified` until a different admin actor approves a `verify` proposal against the notification PDF (or the rule was published through maker–checker).'
        last_verified_at: { type: [string, 'null'], format: date-time, description: 'null while unverified; moves forward on re-verification.' }
        verified_by: { type: [string, 'null'], description: 'Handle of the checker who first verified the rule (as the code returns it and TRD §3 states; round 4 sweep); null while unverified.' }
        reverify_due_at: { type: [string, 'null'], format: date-time, description: 'last_verified_at + 12 months; when past, the resolution carries the warning verification_overdue.' }
        dataset_version: { type: string, description: 'Version in which this rule was published.' }
        citation_note: { type: [string, 'null'], description: 'Present on every rule (round 5). The caveat shown with a seed rule while it is unverified, e.g. "Transcribed from secondary sources; schedule S.No. and gazette text not yet checked against the CBIC PDF. …"; null after a verify approval and on rules published through maker–checker.' }

    RateResolution:
      type: object
      description: |
        Result of the rate-resolution algorithm (data-model §3) for one code on one date.
        - `coverage: ok` → `applicable_rule` set, `ambiguous: false`, `rules` empty.
        - `coverage: ambiguous` → `applicable_rule: null`, `ambiguous: true`, `rules`
          lists every candidate with its condition, `ambiguity_reason` explains, and
          `default_rule_id` names the general rule when the ambiguity is a `none` rule
          plus `other` conditions (else null).
        - `coverage: no_rate_rule` → `applicable_rule: null`, `rules: []`,
          `matched_at_level: null`.
      required: [hsn_queried, as_of, unit_price, coverage, ambiguous, matched_at_level, default_rule_id, warnings, applicable_rule, rules, disclaimer]
      properties:
        hsn_queried: { type: string }
        as_of: { type: string, format: date }
        unit_price: { type: [number, 'null'] }
        coverage: { type: string, enum: [ok, ambiguous, no_rate_rule] }
        ambiguous: { type: boolean }
        ambiguity_reason: { type: string }
        matched_at_level: { type: [integer, 'null'], enum: [2, 4, 5, 6, 8, null], description: 'length(hsn_prefix) of the matched rules; null when none.' }
        default_rule_id: { oneOf: [{ $ref: '#/components/schemas/RuleId' }, { type: 'null' }], description: 'Only when ambiguous: the general (`none`) rule beside `other` conditions, or the rule selected by a synonym rule_hint (classify). The client still confirms it.' }
        rule_selected_by: { type: [string, 'null'], description: 'Null, or how `applicable_rule` was chosen among ambiguous candidates, e.g. `rule_hint:nil_rate_list` (classify, ruling 5).' }
        verification_status: { type: [string, 'null'], enum: [verified, unverified, null], description: 'Verification status of the applicable rule; for an ambiguous result `unverified` if any listed rule is; null when there is no rule.' }
        warnings:
          type: array
          items: { type: string, enum: [rate_unverified, verification_overdue, pending_change_detected, selected_by_hint, no_rate_rule, ambiguous, code_not_in_master] }
          description: |
            Open enum (clients ignore unknown values).
            `selected_by_hint`: classify only; the rule was selected by a curated synonym's `rule_hint` (ruling 5).
            `no_rate_rule` / `ambiguous`: repeat `coverage`.
            `rate_unverified`: the applicable rule (or any listed rule, if ambiguous) is unverified.
            `verification_overdue`: such a rule is verified but past `reverify_due_at`.
            `code_not_in_master` (GET /v1/hsn/{code} only): the code is not in the HSN master and was resolved under `resolved_via`.
            `pending_change_detected`: a detected, not yet published CBIC notification lists an affected prefix related to this code (see `/v1/meta/dataset` `pending_notifications`).
        applicable_rule:
          oneOf:
            - $ref: '#/components/schemas/RateRule'
            - type: 'null'
        rules:
          type: array
          items: { $ref: '#/components/schemas/RateRule' }
        disclaimer: { $ref: '#/components/schemas/Disclaimer' }

    HsnSummary:
      type: object
      required: [code, level, description]
      properties:
        code: { $ref: '#/components/schemas/HsnCodeString' }
        level: { type: integer, enum: [2, 4, 5, 6, 8] }
        description: { type: string }

    HsnDetail:
      type: object
      required: [code, level, type, chapter, description, code_in_master, resolved_via, ancestors, rate, dataset_version, disclaimer]
      properties:
        code: { $ref: '#/components/schemas/HsnCodeString' }
        level: { type: integer, enum: [2, 4, 5, 6, 8], description: 'Length of the requested code (also when it is not in the master).' }
        type: { type: string, enum: [goods, service] }
        chapter: { type: string, pattern: '^\d{2}$' }
        description: { type: string, description: 'For a code not in the master: "<code> is not in the HSN master; shown under <parent>: <parent description>".' }
        code_in_master: { type: boolean, description: 'false when the code is not in the HSN master and was resolved under its nearest known ancestor (round 5, R3).' }
        resolved_via: { type: [string, 'null'], description: 'The ancestor the code was resolved under (6, then 5 for SAC 99xxx, then 4, then 2 digits); null when code_in_master.' }
        ancestors:
          type: array
          items: { $ref: '#/components/schemas/HsnSummary' }
        rate: { $ref: '#/components/schemas/RateResolution' }
        dataset_version: { type: string }
        disclaimer: { $ref: '#/components/schemas/Disclaimer' }

    SearchResult:
      type: object
      required: [query, results, dataset_version]
      properties:
        query: { type: string }
        results:
          type: array
          items:
            type: object
            required: [code, level, type, chapter, description, score]
            properties:
              code: { $ref: '#/components/schemas/HsnCodeString' }
              level: { type: integer, enum: [2, 4, 5, 6, 8] }
              type: { type: string, enum: [goods, service] }
              chapter: { type: string }
              description: { type: string }
              score: { type: number, minimum: 0, maximum: 1, description: 'bm25 normalised to the best hit (best = 1.0). Not a confidence.' }
              highlight: { type: string }
        dataset_version: { type: string }

    ClassifyRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one of `name` or `barcode` is required.
      anyOf:
        - required: [name]
        - required: [barcode]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        barcode: { type: string, pattern: '^(\d{8}|\d{12}|\d{13}|\d{14})$', description: 'GTIN-8/12/13/14, digits only; normalised to GTIN-14.' }
        unit_price: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.01, description: 'INR per unit; resolves price-threshold rate rules for each candidate.' }
        date: { type: string, format: date }
        max_candidates: { type: integer, minimum: 1, maximum: 5, default: 5 }
        allow_llm: { type: boolean, default: false, description: 'Opt in to the optional LLM re-ranker for this request. Ignored when the server has none configured, the key has llm_opt_out, or the LLM budget is spent.' }

    Reason:
      type: object
      required: [code, detail, weight]
      properties:
        code:
          type: string
          enum: [synonym_exact, synonym_partial, synonym_related, fts_match, chapter_keyword, barcode_resolved, barcode_category, barcode_conflict, close_runner_up, llm_rerank, review_hint, no_signal]
          description: 'Open enum (clients must tolerate new values). The 0.84 caps have no reason code of their own: the external-data cap adds a `review_hint` naming the crowd-edited source, and the no-exact-synonym cap shows as `confidence` below the score recomputed from `signals` (architecture.md §5.4). The margin penalty is the `signals.margin_penalty` number. `llm_rerank` detail is a fixed template ("moved from position N to M"); no model text ever appears in a response.'
        detail: { type: string }
        weight: { type: number, minimum: -0.05, maximum: 1, description: 'Contribution of this signal to the raw score (w_i·s_i / Σ_{i∈A} w_i, A = applicable signals); 0 for informational reasons (review_hint, barcode_resolved, close_runner_up, llm_rerank, no_signal).' }

    Signals:
      type: object
      description: Raw signal values feeding the confidence formula (architecture.md §5.4). null = signal not applicable to this request (synonym when no curated synonym matched the text; barcode_category when there is no mapped barcode product).
      required: [synonym, fts, chapter_keyword, barcode_category, margin_penalty]
      properties:
        synonym: { type: [number, 'null'], minimum: 0, maximum: 1 }
        fts: { type: number, minimum: 0, maximum: 1 }
        chapter_keyword: { type: number, minimum: 0, maximum: 1 }
        barcode_category: { type: [number, 'null'], minimum: 0, maximum: 1 }
        margin_penalty: { type: number, minimum: 0, maximum: 0.05 }

    Candidate:
      type: object
      required: [hsn, description, confidence, confidence_band, needs_review, signals, reasons, rate]
      properties:
        hsn: { $ref: '#/components/schemas/HsnCodeString' }
        description: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidence_band: { type: string, enum: [high, medium, low], description: 'high ≥ 0.85 (only with an exact curated synonym on the request name), medium 0.60–0.84, low < 0.60' }
        needs_review: { type: boolean, description: 'true unless confidence_band is high' }
        rule_hint:
          description: Set when an exact curated synonym on the caller's name carried a rule hint (ruling 5); the hinted rule is selected in `rate` only if it is the single rule with that condition code.
          oneOf:
            - type: object
              additionalProperties: false
              required: [condition, synonym]
              properties:
                condition: { type: string, pattern: '^[a-z_]{3,32}$', description: 'Rule condition_code, e.g. nil_rate_list.' }
                synonym: { type: string, description: 'The curated phrase that carried the hint.' }
            - type: 'null'
        signals: { $ref: '#/components/schemas/Signals' }
        reasons:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Reason' }
        rate: { $ref: '#/components/schemas/RateResolution' }

    Product:
      type: object
      required: [gtin, gtin_valid, name, brand, category, source, fetched_at]
      description: 'Product data as the code returns it (00c ruling 35): `source` says where it came from, `fetched_at` when; there is no separate data_source or last-modified field.'
      properties:
        gtin: { type: string, pattern: '^\d{14}$', description: 'Normalised GTIN-14.' }
        gtin_valid: { type: boolean }
        name: { type: [string, 'null'], description: 'External, untrusted text.' }
        brand: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        source: { type: string, enum: [local_cache, open_food_facts, open_beauty_facts, not_found, lookup_failed], description: 'Where this request got the product: the local cache, a live adapter call, `not_found` (the source has no such product; cached 24 h), or `lookup_failed` (the lookup errored or was refused by a budget: per-key daily cap, per-host minute budget, queue full, circuit open; this does not mean the product is missing).' }
        fetched_at: { type: [string, 'null'], format: date-time, description: 'When the record was fetched from the external source (open_food_facts / open_beauty_facts data is external and publicly editable; cache TTL 7 days). Null when nothing was fetched.' }
        hints:
          type: array
          items: { type: string }
          description: 'Present only when the lookup produced a note for the classifier (open list; clients ignore unknown values).'

    ClassifyResponse:
      type: object
      required: [input, normalized_name, product, needs_review, candidates, scoring, classifier, llm_used, dataset_version, disclaimer]
      properties:
        input:
          type: object
          properties:
            name: { type: [string, 'null'] }
            barcode: { type: [string, 'null'] }
            unit_price: { type: [number, 'null'] }
        normalized_name: { type: [string, 'null'] }
        product:
          oneOf:
            - $ref: '#/components/schemas/Product'
            - type: 'null'
        needs_review: { type: boolean, description: 'true unless the top candidate is high band; always true when candidates is empty.' }
        candidates:
          type: array
          maxItems: 5
          description: 'Ordered by rank: the order is the ranking (after any LLM re-rank), and confidences are non-increasing down the list. Candidates with confidence < 0.10 are dropped. If the best is < 0.30 the rest are still returned, all band low, with `message`. Empty only when nothing reaches 0.10.'
          items: { $ref: '#/components/schemas/Candidate' }
        message: { type: [string, 'null'], description: 'Null unless no candidate reaches 0.30 (weak or no match), e.g. "No confident match; confirm manually or search."' }
        scoring:
          type: object
          description: Which signals counted (the applicable set A) and the weight denominator Σ_{i∈A} w_i (0.35, 0.50, 0.85 or 1.00).
          required: [applicable, denominator]
          properties:
            applicable:
              type: object
              required: [synonym, fts, chapter_keyword, barcode_category]
              properties:
                synonym: { type: boolean }
                fts: { type: boolean }
                chapter_keyword: { type: boolean }
                barcode_category: { type: boolean }
            denominator: { type: number, enum: [0.35, 0.5, 0.85, 1.0] }
        classifier:
          type: object
          required: [version]
          properties:
            version: { type: string, description: 'Formula and weights version; currently rules-fts-2.3 (2.1: synonym exactness and the imitation-jewellery qualifier; 2.2: quantity tokens need an allow-listed unit, and brand words from a barcode lookup never count towards exactness; 2.3: an accessory word such as stand, case or charger that follows a candidate''s evidence caps that candidate at 0.45 (low) with a review hint, and packaging words such as box or hamper keep the contents'' candidates with a review hint).' }
            llm_rerank: { type: boolean, description: 'Same as llm_used.' }
        llm_used: { type: boolean, description: 'true only if the LLM re-ranker ran and its output was accepted for this request.' }
        dataset_version: { type: string }
        disclaimer: { $ref: '#/components/schemas/Disclaimer' }

    TaxLineInput:
      type: object
      additionalProperties: false
      required: [hsn, taxable_value, supply_type]
      properties:
        line_id: { type: string, maxLength: 64, description: 'Echoed on the result; default is the zero-based line index as a string ("0", "1", …).' }
        hsn: { $ref: '#/components/schemas/HsnCodeString' }
        taxable_value: { type: number, minimum: 0, maximum: 10000000000, multipleOf: 0.01 }
        quantity:
          description: 'A number or a decimal string (≤ 12 characters): > 0, ≤ 9,999,999, ≤ 3 decimals, checked on the decimal string (ruling 32). Never changes the tax base; when unit_price is absent, used only to derive the unit price for price-threshold rule selection (roundHalfUp(taxable_paise × 1000 / qty_milli)).'
          oneOf:
            - { type: number, exclusiveMinimum: 0, maximum: 9999999, multipleOf: 0.001 }
            - { type: string, maxLength: 12, pattern: '^\d{1,7}(\.\d{1,3})?$' }
        unit_price: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.01, description: 'INR per unit; resolves price-threshold rules.' }
        supply_type: { type: string, enum: [intra, intra_ut, inter], description: 'intra → CGST+SGST; intra_ut → CGST+UTGST; inter → IGST.' }
        rule_id: { allOf: [{ $ref: '#/components/schemas/RuleId' }], description: 'Chooses one of the candidate rules of an ambiguous line (else 422 rule-choice-invalid).' }
        condition: { type: string, enum: [general], description: '"general" chooses default_rule_id of an ambiguous line (422 rule-choice-invalid when there is none). Mutually exclusive with rule_id.' }
      not:
        required: [rule_id, condition]

    TaxCalculateRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        invoice_date: { type: string, format: date }
        invoice_rounding: { type: string, enum: [none, nearest_rupee], default: none, description: 'nearest_rupee adds round_off_paise and grand_total_paise (taxable value plus tax, half-up to the rupee) to the response; tax components are not changed.' }
        accept_unverified: { type: boolean, default: false, description: 'Compute tax on unverified rules (each such line gets note rate_unverified; logged per key). When false, those lines return tax null with needs_input: accept_unverified.' }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/TaxLineInput' }

    TaxAmounts:
      type: object
      description: Rupee numbers (2 decimals). `sgst` is 0 for intra_ut lines and `utgst` is 0 otherwise.
      required: [cgst, sgst, utgst, igst, cess, total_tax]
      properties:
        cgst: { type: number }
        sgst: { type: number }
        utgst: { type: number }
        igst: { type: number }
        cess: { type: number, description: 'Ad-valorem cess only; specific cess is not computed in v1.' }
        total_tax: { type: number }

    TaxAmountsPaise:
      type: object
      description: The same amounts as integer paise (the exact values; rupee numbers are derived from them).
      required: [cgst, sgst, utgst, igst, cess, total_tax]
      properties:
        cgst: { type: integer }
        sgst: { type: integer }
        utgst: { type: integer }
        igst: { type: integer }
        cess: { type: integer }
        total_tax: { type: integer }

    TaxLineResult:
      type: object
      required: [line_id, hsn, supply_type, taxable_value, ambiguous, rule_id, rule_selected_by, default_rule_id, unverified_accepted, igst_rate_bp, igst_rate_percent, tax, tax_paise, effective_from, effective_to, source, last_verified_at, verification_status, warning, warnings, candidate_rules, code_in_master, resolved_via, needs_input, notes]
      properties:
        line_id: { type: string }
        hsn: { type: string }
        supply_type: { type: string, enum: [intra, intra_ut, inter] }
        taxable_value: { type: number }
        ambiguous: { type: boolean, description: 'true when the resolver found more than one candidate rule. A line resolved by the client (rule_id or condition general) stays ambiguous: true and has rule_selected_by set.' }
        rule_id: { oneOf: [{ $ref: '#/components/schemas/RuleId' }, { type: 'null' }], description: 'Also set on a refused unverified line (tax null) so the client can see which rule needs accept_unverified.' }
        rule_selected_by: { type: [string, 'null'], enum: [resolver, rule_id, condition_general, null], description: 'How the rule was chosen; null when no tax was computed.' }
        default_rule_id: { oneOf: [{ $ref: '#/components/schemas/RuleId' }, { type: 'null' }], description: 'Ambiguous lines: the general rule that condition "general" would select.' }
        unverified_accepted: { type: boolean, description: 'true when tax was computed on an unverified rule because the request set accept_unverified.' }
        warnings:
          type: array
          items: { type: string, enum: [code_not_in_master] }
          description: 'Round 6 (SA-C3-08): `["code_not_in_master"]` when the line''s code is not in the HSN master and was resolved under `resolved_via`; the line is still computed. Otherwise `[]`. Open enum: clients must ignore unknown values.'
        igst_rate_bp: { type: [integer, 'null'], description: 'Persist this with rule_id and dataset_version on the invoice.' }
        igst_rate_percent: { type: [number, 'null'] }
        tax:
          oneOf:
            - $ref: '#/components/schemas/TaxAmounts'
            - type: 'null'
        tax_paise:
          oneOf:
            - $ref: '#/components/schemas/TaxAmountsPaise'
            - type: 'null'
        effective_from: { type: [string, 'null'], format: date }
        effective_to: { type: [string, 'null'], format: date }
        source:
          description: 'Citation of the rule used (00c ruling 34): notification and URL only. The full Source (schedule_serial, pdf_sha256) is on GET /v1/hsn/{code}.'
          oneOf:
            - type: object
              required: [notification, url]
              properties:
                notification: { type: string }
                url: { type: string }
            - type: 'null'
        last_verified_at: { type: [string, 'null'], format: date-time }
        verification_status: { type: [string, 'null'], enum: [verified, unverified, null] }
        warning: { type: [string, 'null'], description: 'Human-readable warning; set when the line''s rule is unverified (computed with accept_unverified, or refused without it).' }
        candidate_rules:
          type: array
          items: { $ref: '#/components/schemas/RuleId' }
          description: 'Ambiguous lines only; empty otherwise.'
        code_in_master: { type: boolean, description: 'false when the line''s code is not in the HSN master and was resolved under its nearest known ancestor (round 5, R3; note `code_not_in_master`).' }
        resolved_via: { type: [string, 'null'] }
        needs_input:
          type: array
          items: { type: string, enum: [unit_price, rule_id, condition, hsn, accept_unverified] }
          description: 'What the client may send to resolve this line (any one entry suffices); empty when the line is computed. An ambiguous line on a non-price condition lists `[rule_id, condition]` when a default rule exists (send `rule_id`, or `condition: "general"` for `default_rule_id`), `[rule_id]` without one (core round 9).'
        notes:
          type: array
          items: { type: string }
          description: 'Each note starts with a machine-readable token where one applies, then text: `needs_input: …` (unresolved line, excluded from totals; mirrors the needs_input array), `code_not_in_master: …`, `rate_unverified_refused: …`, `rate_unverified_accepted: …`, `no_rate_rule: …`, `specific_cess_not_computed: …`, `unit_price derived as taxable_value / quantity = …`, the client''s rule choice (`general rule … chosen by the client`, `rule … chosen by the client`) and condition text. Lookups (not this route) carry `verification_overdue` and `pending_change_detected` in their warnings.'

    TaxCalculateResponse:
      type: object
      description: |
        Round 5 (R13): an incomplete invoice never carries a total. When any line has
        `tax: null` (`needs_input` or refused), `complete` is false, `totals`,
        `totals_paise`, `round_off_paise` and `grand_total_paise` are null, and
        `partial_totals` sums the computed lines only, naming the included and excluded
        `line_id`s. A complete invoice has `totals` and `partial_totals: null`.
      required: [invoice_date, complete, lines, totals, totals_paise, partial_totals, invoice_rounding, warnings, dataset_version, disclaimer]
      properties:
        invoice_date: { type: string, format: date }
        complete: { type: boolean, description: 'false if any line has tax null.' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/TaxLineResult' }
        totals:
          description: Sum over all lines; null when complete is false.
          oneOf:
            - $ref: '#/components/schemas/TaxTotals'
            - type: 'null'
        totals_paise:
          oneOf:
            - $ref: '#/components/schemas/TaxTotalsPaise'
            - type: 'null'
        partial_totals:
          description: Only when complete is false; null otherwise.
          oneOf:
            - type: object
              required: [complete, included_line_ids, excluded_line_ids, totals, totals_paise]
              properties:
                complete: { type: boolean, const: false }
                included_line_ids: { type: array, items: { type: string } }
                excluded_line_ids: { type: array, items: { type: string } }
                totals: { $ref: '#/components/schemas/TaxTotals' }
                totals_paise: { $ref: '#/components/schemas/TaxTotalsPaise' }
            - type: 'null'
        invoice_rounding: { type: string, enum: [none, nearest_rupee] }
        warnings:
          type: array
          items: { type: string, enum: [code_not_in_master] }
          description: 'Round 6 (SA-C3-08): contains `code_not_in_master` when any line does. A not-in-master line is computed, so `complete` can be true together with this warning.'
        round_off_paise: { type: [integer, 'null'], description: 'Present only when invoice_rounding = nearest_rupee: grand_total_paise − (taxable value + total tax); null when complete is false.' }
        grand_total_paise: { type: [integer, 'null'], description: 'Present only when invoice_rounding = nearest_rupee: taxable value plus total tax, rounded half-up to the rupee; null when complete is false.' }
        dataset_version: { type: string }
        disclaimer: { $ref: '#/components/schemas/Disclaimer' }

    TaxTotals:
      allOf:
        - $ref: '#/components/schemas/TaxAmounts'
        - type: object
          required: [taxable_value]
          properties:
            taxable_value: { type: number }

    TaxTotalsPaise:
      allOf:
        - $ref: '#/components/schemas/TaxAmountsPaise'
        - type: object
          required: [taxable_value]
          properties:
            taxable_value: { type: integer }

    Change:
      type: object
      required: [seq, change_type, dataset_version, published_at, affected_prefix, rule_id, related_rule_id, effective_from, effective_to, retroactive, affects_from, summary]
      properties:
        seq: { type: integer, format: int64 }
        change_type: { type: string, enum: [rule_added, rule_end_dated, rule_verified, rule_corrected, hsn_added, hsn_updated, refdata_changed], description: 'Open enum; clients invalidate on unknown types too. hsn_added: a new code published by a refdata_change add_code proposal.' }
        dataset_version: { type: string }
        published_at: { type: string, format: date-time }
        affected_prefix: { type: string, pattern: '^\d{2,8}$', description: 'Invalidate cached code c when c.startsWith(affected_prefix) || affected_prefix.startsWith(c).' }
        rule_id: { oneOf: [{ $ref: '#/components/schemas/RuleId' }, { type: 'null' }], description: 'For rule_corrected: the replacement rule.' }
        related_rule_id: { oneOf: [{ $ref: '#/components/schemas/RuleId' }, { type: 'null' }], description: 'rule_corrected only: the voided rule.' }
        effective_from: { type: [string, 'null'], format: date }
        effective_to: { type: [string, 'null'], format: date }
        retroactive: { type: boolean, description: 'true when the change affects dates before its publish date (IST).' }
        affects_from: { type: [string, 'null'], format: date, description: 'First date whose answer changed (retroactive rows).' }
        summary: { type: string, description: 'Human-readable line. For rule_verified it names the citation as it stands after the approval (core round 10), e.g. "3004 0% rule verified against 10/2025-CT(Rate)".' }

    ChangeFeed:
      type: object
      required: [since, next_since, has_more, feed_epoch, current_dataset_version, changes]
      properties:
        since: { type: integer }
        next_since: { type: integer }
        has_more: { type: boolean }
        feed_epoch: { type: string, minLength: 8, maxLength: 64, description: 'Changes when the server is restored from a backup; on change, drop the cache and resync from since=0.' }
        current_dataset_version: { type: string }
        changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }

    PendingNotification:
      type: object
      required: [notification, url, detected_at, effective_from, expedite, affected_prefixes]
      properties:
        notification: { type: string, description: 'Canonical notification_ref.' }
        url: { type: [string, 'null'] }
        detected_at: { type: string, format: date-time }
        effective_from: { type: [string, 'null'], format: date }
        expedite: { type: boolean }
        affected_prefixes: { type: array, minItems: 1, items: { type: string, pattern: '^\d{2,8}$' }, description: 'Set at triage (rows without prefixes are counted in untriaged_notifications instead).' }

    DatasetMeta:
      type: object
      required: [dataset_version, published_at, content_sha256, sha256, signature, signature_alg, last_change_seq, feed_epoch, oldest_last_verified_at, sources_checked_at, freshness_sla_business_days, untriaged_notifications, pending_notifications, coverage, known_data_gaps, sources, classifier, disclaimer]
      properties:
        dataset_version: { type: string, pattern: '^\d{4}\.\d{2}\.\d{2}-\d+$' }
        published_at: { type: string, format: date-time }
        content_sha256: { allOf: [{ $ref: '#/components/schemas/Sha256Hex' }], description: 'sha256 of the RFC 8785 canonical export of the active dataset (rules, codes, reference data); equals dataset_versions.content_sha256 and the value in the exported audit head.' }
        sha256: { allOf: [{ $ref: '#/components/schemas/Sha256Hex' }], description: 'Alias of content_sha256.' }
        signature: { type: [string, 'null'], description: 'Optional detached signature over content_sha256 (not produced in v1; null).' }
        signature_alg: { type: [string, 'null'], description: '"ed25519" when signature is set, else null.' }
        last_change_seq: { type: integer }
        feed_epoch: { type: string, minLength: 8, maxLength: 64 }
        oldest_last_verified_at: { type: [string, 'null'], format: date-time, description: 'Oldest last_verified_at among verified active rules; null if none is verified.' }
        sources_checked_at: { type: [string, 'null'], format: date-time, description: 'finished_at of the last successful CBIC watcher run (watcher_runs status ok); null when the watcher has never succeeded.' }
        untriaged_notifications: { type: integer, minimum: 0, description: 'Open watched notifications with no affected_prefixes yet (typically just found by the watcher). They are not listed in pending_notifications and add no warning to lookups until triaged.' }
        freshness_sla_business_days: { type: integer, const: 2 }
        pending_notifications:
          type: array
          description: Triaged notifications (state detected, affected_prefixes set) not yet published or dismissed.
          items: { $ref: '#/components/schemas/PendingNotification' }
        coverage:
          type: object
          required: [hsn_codes, sac_codes, rate_rules_active, rate_rules_verified, rate_rules_unverified, rate_rules_verification_overdue, hsn_chapters_with_rules, rules_verified_last_90_days_percent, codes_without_rules]
          properties:
            hsn_codes: { type: integer }
            sac_codes: { type: integer }
            rate_rules_active: { type: integer }
            rate_rules_verified: { type: integer }
            rate_rules_unverified: { type: integer }
            rate_rules_verification_overdue: { type: integer, description: 'Verified active rules past reverify_due_at.' }
            hsn_chapters_with_rules: { type: integer }
            rules_verified_last_90_days_percent: { type: number }
            codes_without_rules: { type: integer, minimum: 0, description: 'Master codes of 4+ digits with no rule in force today at, above or below them (core round 9). A lookup of such a code returns coverage no_rate_rule.' }
        known_data_gaps:
          type: array
          description: 'Curated list of known gaps (core round 9), read at boot from `data/seed/known_gaps.json` or `HSN_KNOWN_GAPS_FILE`; not part of the dataset hash. A prefix listed here means "not yet curated", not "no rate exists". Empty when the file is absent.'
          items:
            type: object
            required: [prefix, kind, reason]
            properties:
              prefix: { type: [string, 'null'], description: 'HSN/SAC prefix, or null for a gap that is not tied to one code (e.g. cess history).' }
              kind: { type: string, enum: [disputed, not_researched, not_transcribed, not_expressible, period_gap] }
              reason: { type: string }
        sources:
          type: array
          description: 'Distinct citations of the active rules: notification and URL only (the full Source, with pdf_sha256 and schedule_serial, is on GET /v1/hsn/{code}).'
          items:
            type: object
            required: [notification, url, rule_count, verified_count]
            properties:
              notification: { type: string }
              url: { type: string }
              rule_count: { type: integer, minimum: 1, description: 'In-force rules citing this notification and URL (core round 10).' }
              verified_count: { type: integer, minimum: 0, description: 'How many of them are verified.' }
        classifier:
          type: object
          description: Disclosure of the optional LLM re-ranker and external barcode lookups.
          required: [llm_configured, llm_provider, external_lookups]
          properties:
            llm_configured: { type: boolean, description: 'true if an LLM re-ranker is configured on this server (requests still need allow_llm: true).' }
            llm_provider: { type: [string, 'null'], description: 'Provider name when configured, else null.' }
            external_lookups: { type: array, items: { type: string, enum: [open_food_facts, open_beauty_facts] }, description: 'Enabled barcode adapters; empty by default.' }
        disclaimer: { $ref: '#/components/schemas/Disclaimer' }

    RateRuleInput:
      type: object
      additionalProperties: false
      required: [hsn_prefix, igst_rate_bp, condition, effective_from, source]
      properties:
        hsn_prefix: { allOf: [{ $ref: '#/components/schemas/HsnCodeString' }], description: 'Must exist as an active hsn_codes.code.' }
        igst_rate_bp: { type: integer, minimum: 0, maximum: 10000, description: 'Must be in HSN_ALLOWED_RATES_BP (default 0, 10, 25, 100, 150, 300, 500, 600, 1200, 1800, 2800, 4000; historical slabs kept so old effective-dated rules load). No bypass flag.' }
        cess:
          type: object
          additionalProperties: false
          required: [rate_bp]
          properties:
            rate_bp: { type: integer, minimum: 0, maximum: 30000 }
            specific_amount: { type: [number, 'null'], minimum: 0, maximum: 1000000000 }
            specific_unit: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        condition:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [none, price, other] }
            code: { type: [string, 'null'], enum: [nil_rate_list, null], description: 'A CONDITION_CODES value, or null.' }
            text: { type: [string, 'null'], maxLength: 500 }
            min_unit_price: { type: [number, 'null'], minimum: 0, maximum: 1000000000 }
            max_unit_price: { type: [number, 'null'], minimum: 0, maximum: 1000000000 }
        effective_from: { type: string, format: date, description: '≥ 2017-07-01. Before today (IST) → the proposal needs retroactive_reason.' }
        effective_to: { type: [string, 'null'], format: date }
        source:
          type: object
          additionalProperties: false
          required: [notification, url, pdf_sha256, schedule_serial]
          description: 'Citation for the rule (00c ruling 35, the code''s shape). `url` is checked against HSN_SOURCE_HOSTS (https, exact hostname, no userinfo, default port).'
          properties:
            notification: { type: string, minLength: 3, maxLength: 300, description: 'Canonical notification_ref (core round 10, enforced at every entry point): after normalisation it must match `^[1-9][0-9]{0,3}/(19|20)[0-9]{2}-(CT|IT|UTT|Cess)\(Rate\)(, Schedule (I|II|III|IV|V|VI|VII))?$`, e.g. "9/2025-CT(Rate), Schedule IV". Normalisation strips zero padding, collapses whitespace and rewrites the long series names (Central Tax (Rate), Integrated Tax (Rate), Union Territory Tax (Rate), (Compensation) Cess (Rate), CT (Rate)) to the short form: "09/2025-Central Tax (Rate), Schedule I" is stored as "9/2025-CT(Rate), Schedule I". Anything else → 400 validation-failed, code pattern. The schedule serial goes in schedule_serial, never here. Failure pointer: /rule/source/notification.' }
            url: { type: string, minLength: 8, maxLength: 2000, description: 'A notification document (ruling 36; core round 10, SA-C5-03): no query string or fragment; the path exactly as written (no `;`, `..`, `//`, `%2e`, `%2f`, `%5c`); the path is `/view-pdf/<id>[/…]` or a `*.pdf` file, and not a listing/index page (compared on origin plus lower-cased path with repeated slashes collapsed).' }
            pdf_sha256: { $ref: '#/components/schemas/Sha256Hex' }
            schedule_serial: { type: string, minLength: 1, maxLength: 100 }

    ProposalAction:
      type: string
      enum: [create, supersede, end_date, verify, correct, refdata_change, admin_grant, disable_actor, dataset_import]
      description: '`disable_actor` (round 4, SA-C2-04) is stored as an `admin_grant` row with `payload.op = "disable_actor"`; `dataset_import` (round 5, R11) as a `refdata_change` row with `payload.op = "dataset_import"`. The API shows the action name. `dataset_import` is created and approved only by `scripts/import-dataset.ts`.'

    RefdataChange:
      type: object
      additionalProperties: false
      required: [table, op]
      description: |
        One reference-data change (ruling 23), in the code's `{table, op, …}` shapes:
        - `{table: synonym, op: add, phrase, hsn_code, strength?, note?, rule_hint?}`
        - `{table: category_map, op: add, source, category, hsn_prefix}`
        - `{table: chapter_keyword, op: add, keyword, chapter}`
        - `{table: synonym | category_map | chapter_keyword, op: deactivate, id}`
        - `{table: hsn_description, op: update, code, description, keywords?}`
        - `{table: hsn_code, op: add_code, code, description, keywords?, type?}`: a new
          HSN/SAC code (length 2, 4, 6 or 8, or 5 in chapter 99); it must not exist, its
          chapter must exist, its parent is the nearest existing ancestor, a 6- or
          8-digit code needs its 4-digit heading, `type` must match the chapter
          (`service` only in chapter 99), `description` 1–2000 characters, and no other
          pending proposal may add the same code. Approval publishes a new dataset
          version with an `hsn_added` feed row.
        `op: deactivate` on `hsn_code` / `hsn_description` is refused (400): codes are
        never removed. Rows are never deleted.
      properties:
        table: { type: string, enum: [synonym, category_map, chapter_keyword, hsn_description, hsn_code] }
        op: { type: string, enum: [add, deactivate, update, add_code] }
        id: { type: integer, minimum: 1, description: 'Row to deactivate.' }
        phrase: { type: string, minLength: 1, maxLength: 200 }
        hsn_code: { $ref: '#/components/schemas/HsnCodeString' }
        strength: { type: string, enum: [primary, related] }
        note: { type: [string, 'null'], maxLength: 1000 }
        rule_hint: { type: [string, 'null'], description: 'A condition_code from the server''s CONDITION_CODES list, or null.' }
        source: { type: string, minLength: 1, maxLength: 64, description: 'category_map source, e.g. open_food_facts.' }
        category: { type: string, minLength: 1, maxLength: 200 }
        hsn_prefix: { $ref: '#/components/schemas/HsnCodeString' }
        keyword: { type: string, minLength: 1, maxLength: 64 }
        chapter: { type: string, pattern: '^\d{2}$' }
        code: { $ref: '#/components/schemas/HsnCodeString' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        keywords: { type: string, maxLength: 2000 }
        type: { type: string, enum: [goods, service] }

    AdminGrant:
      type: object
      additionalProperties: false
      required: [handle, new_actor]
      description: 'The code''s shape (00c ruling 35). `new_actor: true` creates admin actor `handle` on approval (409 `proposal-stale` if it was created meanwhile; 400 if it already exists at proposal time). `new_actor: false` authorises an extra admin key for the existing, enabled actor `handle` and must be proposed by that actor itself (else 400, error code `not_self`; round 4, SA-C2-05); the operator then mints it with `npx tsx scripts/create-key.ts --tenant internal --scopes admin --actor <handle> --grant <proposal id>` within `HSN_ADMIN_GRANT_TTL_HOURS` (default and maximum 72) of the approval, after which the grant expires. `handle` is NFKC-normalised, trimmed and lower-cased and must then match `[a-z0-9_-]{3,32}`. v1 sends no out-of-band notice (ruling 29); the grant and the key creation are audited.'
      properties:
        handle: { type: string, minLength: 1, maxLength: 64 }
        display_name: { type: string, maxLength: 100 }
        new_actor: { type: boolean }

    RateProposalCreate:
      type: object
      additionalProperties: false
      required: [action, rationale]
      properties:
        action: { type: string, enum: [create, supersede, end_date, verify, correct, admin_grant, disable_actor, refdata_change], description: '`dataset_import` is not accepted here (scripts/import-dataset.ts only).' }
        supersedes_rule_id: { allOf: [{ $ref: '#/components/schemas/RuleId' }], description: 'Required for supersede, end_date, verify and correct (the target rule); refused otherwise.' }
        end_date: { type: string, format: date, description: 'Required for end_date, refused otherwise. end_date carries no citation of its own (00c ruling 35).' }
        rule: { allOf: [{ $ref: '#/components/schemas/RateRuleInput' }], description: 'Required for create, supersede and correct; refused (400) otherwise.' }
        source:
          type: object
          additionalProperties: false
          required: [pdf_sha256, schedule_serial]
          description: 'Required for verify, refused (400) otherwise (00c ruling 35; ruling 36): the PDF the reviewer read and the schedule serial. `url` and `notification` are allowed only on the first verify of an unverified rule and replace the rule''s citation on approval (in one statement with the verification fields; `citation_note` becomes null). `url` is required when the rule cites a listing/index page (400 `source-url-not-document`, pointer /source/url, code required); it must be on HSN_SOURCE_HOSTS and be a document (path contains /view-pdf/ or ends in .pdf, and is not one of the index pages: central-tax-rate.html, integrated-tax-rate.html, gst-goods-services-rates.html, the watcher pages and HSN_SOURCE_INDEX_PAGES), else 400 `validation-failed` at /source/url. On an already verified rule either field → 400 (pointer /source, code forbidden).'
          properties:
            pdf_sha256: { $ref: '#/components/schemas/Sha256Hex' }
            schedule_serial: { type: string, minLength: 1, maxLength: 100 }
            url: { type: string, minLength: 8, maxLength: 2000, description: 'Ruling 36: the notification document the reviewer read. A notification document (ruling 36; core round 10, SA-C5-03): no query string or fragment; the path exactly as written (no `;`, `..`, `//`, `%2e`, `%2f`, `%5c`); the path is `/view-pdf/<id>[/…]` or a `*.pdf` file, and not a listing/index page (compared on origin plus lower-cased path with repeated slashes collapsed).' }
            notification: { type: string, minLength: 3, maxLength: 300, description: 'Ruling 36. Canonical notification_ref (core round 10, enforced at every entry point): after normalisation it must match `^[1-9][0-9]{0,3}/(19|20)[0-9]{2}-(CT|IT|UTT|Cess)\(Rate\)(, Schedule (I|II|III|IV|V|VI|VII))?$`, e.g. "9/2025-CT(Rate), Schedule IV". Normalisation strips zero padding, collapses whitespace and rewrites the long series names (Central Tax (Rate), Integrated Tax (Rate), Union Territory Tax (Rate), (Compensation) Cess (Rate), CT (Rate)) to the short form: "09/2025-Central Tax (Rate), Schedule I" is stored as "9/2025-CT(Rate), Schedule I". Anything else → 400 validation-failed, code pattern. The schedule serial goes in schedule_serial, never here. Failure pointer: /source/notification.' }
        refdata: { allOf: [{ $ref: '#/components/schemas/RefdataChange' }], description: 'Required for refdata_change, refused otherwise.' }
        grant: { allOf: [{ $ref: '#/components/schemas/AdminGrant' }], description: 'Required for admin_grant, refused otherwise.' }
        disable:
          type: object
          additionalProperties: false
          required: [handle]
          description: 'Required for disable_actor, refused otherwise (round 4, SA-C2-04). 400 `validation-failed` with error code `last_actors` when it would leave fewer than two active admins. On approval the actor is disabled at once (its keys get 401), its pending proposals are withdrawn, and `admin.disabled` is audited.'
          properties:
            handle: { type: string, minLength: 1, maxLength: 64 }
        retroactive_reason: { type: string, minLength: 1, maxLength: 2000, description: 'Required when the change takes effect before today (IST).' }
        rationale: { type: string, minLength: 10, maxLength: 2000 }

    RateProposal:
      type: object
      description: Proposal as returned by the code (00c ruling 34). `rule` is set for create, supersede and correct; `payload` holds the action's other data (verify → `{source}` with `pdf_sha256` / `schedule_serial`; admin_grant → `{handle, display_name, new_actor}`; disable_actor → `{op, handle}` with op `disable_actor`; dataset_import → `{op, files, counts}` with op `dataset_import` and files mapping name to sha256; refdata_change → the `RefdataChange` object).
      required: [id, status, action, supersedes_rule_id, target_rule, end_date, rule, payload, rationale, retroactive, retroactive_reason, content_sha256, proposed_by, proposed_at, decided_by, decided_at, decision_comment, resulting_rule_id, resulting_dataset_version]
      properties:
        id: { type: string, pattern: '^rp_[0-9A-HJKMNP-TV-Z]{26}$' }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        action: { $ref: '#/components/schemas/ProposalAction' }
        supersedes_rule_id: { oneOf: [{ $ref: '#/components/schemas/RuleId' }, { type: 'null' }] }
        target_rule:
          description: Current published state of supersedes_rule_id, so the checker sees what is ended, voided or verified.
          oneOf:
            - type: object
              required: [rule_id, hsn_prefix, igst_rate_bp, igst_rate_percent, condition_kind, condition_text, effective_from, effective_to, status, verification_status, notification]
              properties:
                rule_id: { $ref: '#/components/schemas/RuleId' }
                hsn_prefix: { type: string }
                igst_rate_bp: { type: integer }
                igst_rate_percent: { type: number }
                condition_kind: { type: string, enum: [none, price, other] }
                condition_text: { type: [string, 'null'] }
                effective_from: { type: string, format: date }
                effective_to: { type: [string, 'null'], format: date }
                status: { type: string, enum: [active, voided] }
                verification_status: { type: string, enum: [verified, unverified] }
                notification: { type: string }
                citation_note: { type: [string, 'null'], description: 'Round 8: the target rule''s citation note, so the checker sees the source caveat (for example a secondary-source transcription) before approving.' }
            - type: 'null'
        end_date: { type: [string, 'null'], format: date }
        rule:
          oneOf:
            - type: object
              required: [hsn_prefix, igst_rate_bp, cess, condition, effective_from, effective_to, source]
              properties:
                hsn_prefix: { type: string }
                igst_rate_bp: { type: integer }
                cess: { $ref: '#/components/schemas/Cess' }
                condition:
                  type: object
                  properties:
                    kind: { type: string, enum: [none, price, other] }
                    code: { type: [string, 'null'] }
                    text: { type: [string, 'null'] }
                    min_unit_price: { type: [number, 'null'] }
                    max_unit_price: { type: [number, 'null'] }
                effective_from: { type: string, format: date }
                effective_to: { type: [string, 'null'], format: date }
                source:
                  type: object
                  properties:
                    notification: { type: string }
                    url: { type: string }
                    pdf_sha256: { type: string }
                    schedule_serial: { type: string }
            - type: 'null'
        payload: { type: [object, 'null'] }
        rationale: { type: string }
        retroactive: { type: boolean }
        retroactive_reason: { type: [string, 'null'] }
        content_sha256: { allOf: [{ $ref: '#/components/schemas/Sha256Hex' }], description: 'sha256 of the RFC 8785 canonical JSON of the proposal content; send it as expected_sha256 on approve/reject.' }
        proposed_by: { type: string, description: 'Proposer handle (the DB also keeps proposed_by_actor_id; maker ≠ checker compares actor ids).' }
        proposed_at: { type: string, format: date-time }
        decided_by: { type: [string, 'null'], description: 'Checker handle; null while pending and for automatic withdrawals.' }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_comment: { type: [string, 'null'] }
        resulting_rule_id: { oneOf: [{ $ref: '#/components/schemas/RuleId' }, { type: 'null' }] }
        resulting_dataset_version: { type: [string, 'null'] }

    AuditEntry:
      type: object
      required: [id, at, actor, key_prefix, action, entity_type, entity_id, details, prev_hash, hash]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string, description: 'Admin actor handle, or system:<job> (e.g. system:cbic-watcher); never a person''s full name.' }
        key_prefix: { type: [string, 'null'], description: 'Display prefix of the API key used (hsk_ + 8 characters); never key material. null for scripts and system jobs.' }
        action: { type: string, examples: [rate_proposal.created, rate_proposal.approved, rate_proposal.withdrawn, api_key.created, dataset.seeded, watched_notification.detected, watched_notification.triaged, product.purged] }
        entity_type: { type: string }
        entity_id: { type: string }
        details: { type: object, description: 'Approval, verify, end-date, correct and seed entries include the full canonical rule rows with rule_sha256 and dataset_content_sha256.' }
        prev_hash: { allOf: [{ $ref: '#/components/schemas/Sha256Hex' }], description: 'hash of the previous entry; 64 zeros for the first entry.' }
        hash: { allOf: [{ $ref: '#/components/schemas/Sha256Hex' }], description: 'hex HMAC-SHA256(HSN_AUDIT_KEY, prev_hash || "\n" || JCS({id, at, actor, key_prefix, action, entity_type, entity_id, details})).' }

    AuditPage:
      type: object
      required: [entries, next_after_id, head_id, head_hash, chain_ok, chain_broken_at, verify_note]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        next_after_id: { type: integer }
        head_id: { type: integer, description: 'Id of the newest audit entry (0 when empty).' }
        head_hash: { type: [string, 'null'], description: 'Hash of the newest entry; compare with the exported off-host head.' }
        chain_ok: { type: [boolean, 'null'], description: 'null unless verify=true and the span was verified.' }
        chain_broken_at: { type: [integer, 'null'], description: 'First entry id whose hash or link fails, when chain_ok is false.' }
        verify_note: { type: [string, 'null'], description: 'Set when verification was skipped (span over 10,000 entries: use scripts/verify-audit.ts).' }

    WatchedNotification:
      type: object
      required: [id, notification_ref, source_url, affected_prefixes, effective_from, detected_at, state, expedite, note, created_by, resolved_at, resolved_by, source, notification_key, title, notification_date]
      properties:
        id: { type: string, pattern: '^wn_[0-9A-HJKMNP-TV-Z]{26}$' }
        notification_ref: { type: string, description: 'Canonical notification_ref (manual) or the item text the watcher read.' }
        source_url: { type: string }
        affected_prefixes: { type: array, items: { type: string }, description: 'Empty until triage for watcher rows.' }
        effective_from: { type: [string, 'null'], format: date }
        detected_at: { type: string, format: date-time }
        state: { type: string, enum: [detected, published, dismissed] }
        expedite: { type: boolean }
        note: { type: [string, 'null'] }
        created_by: { type: string, description: 'Actor handle, or system:cbic-watcher.' }
        resolved_at: { type: [string, 'null'], format: date-time }
        resolved_by: { type: [string, 'null'] }
        source: { type: string, enum: [manual, cbic_watcher] }
        notification_key: { type: [string, 'null'], description: 'Identity used for de-duplication, e.g. central_tax_rate:1/2026 (a corrigendum adds :corrigendum:<date>). Unique among rows.' }
        title: { type: [string, 'null'] }
        notification_date: { type: [string, 'null'], format: date }
        pending_action:
          description: 'Rounds 4 and 6 (SA-C2-03, SA-C3-03): a request on a row with a `notification_key` that waits for a second admin (resolve, first triage, or a triage that removes prefixes); null otherwise.'
          oneOf:
            - type: object
              required: [kind, by, at]
              properties:
                kind: { type: string, enum: [published, dismissed, triage] }
                affected_prefixes: { type: [array, 'null'], items: { type: string } }
                effective_from: { type: [string, 'null'], format: date }
                by: { type: string, description: 'Handle of the admin who asked.' }
                at: { type: string, format: date-time }
            - type: 'null'

    WatchedNotificationCreate:
      type: object
      additionalProperties: false
      required: [notification, url, affected_prefixes]
      properties:
        notification: { type: string, minLength: 3, maxLength: 300, description: 'Canonical form, e.g. 2/2026-CT(Rate).' }
        url: { type: string, minLength: 8, maxLength: 2000, description: 'https URL on a host in HSN_SOURCE_HOSTS.' }
        affected_prefixes:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: string, pattern: '^(\d{2}|\d{4}|99\d{3}|\d{6}|\d{8})$' }
        effective_from: { type: string, format: date }
        expedite: { type: boolean, default: false }
        note: { type: string, maxLength: 1000 }

    WatcherRun:
      type: object
      required: [id, started_at, finished_at, status, items_seen, items_new, error]
      properties:
        id: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        status: { type: string, enum: [ok, failed] }
        items_seen: { type: integer, minimum: 0 }
        items_new: { type: integer, minimum: 0 }
        error: { type: [string, 'null'], description: 'Fail-closed reason, e.g. <page>: not_html | shape_changed | no_items | wrong_series | too_many_malformed | shrunk, or a fetch error.' }

    WatcherStatus:
      type: object
      required: [freshness, last_run, recent_runs, untriaged]
      properties:
        freshness:
          type: object
          required: [checked_at, sources_checked_at, hours_since_success, watcher_stale, alert, reasons, overdue_notifications]
          properties:
            checked_at: { type: string, format: date-time }
            sources_checked_at: { type: [string, 'null'], format: date-time }
            hours_since_success: { type: [number, 'null'] }
            watcher_stale: { type: boolean, description: 'No successful run in the last 36 hours, or never.' }
            alert: { type: boolean }
            reasons: { type: array, items: { type: string } }
            overdue_notifications:
              type: array
              items:
                type: object
                required: [id, notification, detected_at, due_at]
                properties:
                  id: { type: string }
                  notification: { type: string }
                  detected_at: { type: string, format: date-time }
                  due_at: { type: string, format: date-time }
        last_run:
          oneOf:
            - $ref: '#/components/schemas/WatcherRun'
            - type: 'null'
        recent_runs:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/WatcherRun' }
        untriaged: { type: integer, minimum: 0 }
