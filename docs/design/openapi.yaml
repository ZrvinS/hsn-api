  /v1/tax/calculate:
    post:
      tags: [tax]
      operationId: calculateTax
      summary: CGST/SGST/UTGST/IGST/cess breakdown for invoice lines
      description: |
        Uses only published rate rules. For each line the rate is resolved for
        `invoice_date` (default today IST) with the same algorithm as
        `GET /v1/hsn/{code}`, using the line's `unit_price` for price-threshold rules.
        `quantity` (> 0, ≤ 9,999,999, ≤ 3 decimals) never changes the tax base (`taxable_value`); when
        `unit_price` is absent it is used only to derive the unit price for rule
        selection: roundHalfUp(taxable_paise × 1000 / qty_milli).

        **Ambiguous lines.** If the resolution is ambiguous, the line is computed only
        when it names the rule: `rule_id` (must be one of the candidate rules, else 422
        `rule-choice-invalid`) or `condition: general` (uses `default_rule_id`; 422
        `rule-choice-invalid` when there is none). Otherwise the line returns
        `ambiguous: true`, `tax: null`, its `candidate_rules`, `default_rule_id`, and
        `needs_input` listing what would resolve it (`unit_price`, `rule_id`, `condition` or `hsn`;
        3004 without a choice gives `[rule_id, condition]`);
        the response has `complete: false`. `rule_selected_by` on each computed line
        says how its rule was chosen: `resolver`, `rule_id` or `condition_general`.
        The API never guesses a rate.

        **Unverified rules (ruling 24).** A line whose rule is `unverified` is computed
        only when the request sets `accept_unverified: true` (the line then has
        `unverified_accepted: true`, the `warning` text and the note
        `rate_unverified_accepted`, and the acceptance is logged per key). Without it the
        line returns `tax: null` with `needs_input: [accept_unverified]`, the `warning`
        text and the note `rate_unverified_refused`, and is excluded from totals.

        **Supply type.** `intra` → CGST + SGST, each IGST/2. `intra_ut` (intra-UT supply
        in a Union Territory without legislature) → CGST + UTGST, each IGST/2. `inter` →
        IGST.

        **Rounding.** Each component is computed in paise as
        `roundHalfUp(taxable_paise × igst_rate_bp, 20000)` for CGST/SGST/UTGST and
        `roundHalfUp(taxable_paise × igst_rate_bp, 10000)` for IGST, per line; totals are
        sums of rounded line amounts. An incomplete invoice (any line with `tax: null`)
        has `totals`, `totals_paise`, `round_off_paise` and `grand_total_paise` null and
        a `partial_totals` object over the computed lines only (round 5, R13). Only ad-valorem cess
        (`rate_bp`) is computed; specific (per-unit) cess is **not computed in v1**
        (note `specific_cess_not_computed`). Optional `invoice_rounding: nearest_rupee`
        adds `round_off_paise` and `grand_total_paise` (taxable value plus tax, half-up to
        the rupee; complete invoices only) without touching tax components.

        **Codes outside the master (round 5, R3).** A line whose code is not in the HSN
        master but has a known ancestor is computed under it (`code_in_master: false`,
        `resolved_via`, note `code_not_in_master`); 422 `unknown-hsn` only when the
        code's chapter does not exist. Every amount is given twice: rupee
        numbers in `tax` / `totals` and integer paise in `tax_paise` / `totals_paise`
        (ruling 32).

        Token cost: 1 + floor(lines/50), charged from the raw `lines` length **before** validation (core round 10, SA-C5-01), so an oversized invalid body still pays for its size (85,000 items cost 1701 tokens and get 429 on a default 600/min key).
      security:
        - apiKey: [read]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxCalculateRequest' }
            examples:
              ring:
                summary: "22K ring, intra-state, unverified rate accepted explicitly"
                value:
                  invoice_date: '2026-10-11'
                  accept_unverified: true
                  lines:
                  - line_id: '1'
                    hsn: '7113'
                    taxable_value: 68500.0
                    quantity: 8.25
                    supply_type: intra
              partial:
                summary: "Line 2 needs unit_price: totals null, partial_totals over line 1"
                value:
                  invoice_date: '2026-10-11'
                  accept_unverified: true
                  invoice_rounding: nearest_rupee
                  lines:
                  - line_id: '1'
                    hsn: '7113'
                    taxable_value: 68500.0
                    supply_type: intra
                  - line_id: '2'
                    hsn: '6109'
                    taxable_value: 3600.0
                    supply_type: intra
              pharmacy:
                summary: "Pharmacy bill, inter-state; 3004 general rule chosen"
                value:
                  invoice_date: '2026-10-11'
                  accept_unverified: true
                  lines:
                  - line_id: '1'
                    hsn: '3004'
                    taxable_value: 120.0
                    supply_type: inter
                    condition: general
                  - line_id: '2'
                    hsn: '9018'
                    taxable_value: 1150.0
                    supply_type: inter
                  - line_id: '3'
                    hsn: '3822'
                    taxable_value: 450.0
                    supply_type: inter
              notInMaster:
                summary: "8-digit code not in the master, resolved under 6109"
                value:
                  invoice_date: '2026-10-11'
                  accept_unverified: true
                  lines:
                  - line_id: '1'
                    hsn: '61091000'
                    taxable_value: 1800.0
                    unit_price: 1800
                    supply_type: intra
              unverifiedNotAccepted:
                summary: "Unverified rule without accept_unverified \u2192 tax null"
                value:
                  invoice_date: '2026-10-11'
