  /v1/rates/changes:
    get:
      tags: [rates]
      operationId: listRateChanges
      summary: Change feed of published rate rules and HSN/reference entries
      description: |
        Returns changes with `seq > since`, oldest first. `seq` is a strictly
        increasing integer assigned when a dataset version is published. Start with
        `since=0` (full snapshot as changes), store `next_since` and `feed_epoch`, poll
        again with `next_since`. When `has_more` is true, call again immediately.
        Changes are never edited or removed; a correction appears as a `rule_corrected`
        change naming both the replacement (`rule_id`) and the voided rule
        (`related_rule_id`).

        **Invalidation (ruling 3).** For each change, invalidate every cached code `c`
        where `c.startsWith(affected_prefix) || affected_prefix.startsWith(c)`.

        **Resync.** If `feed_epoch` differs from the stored value (the server was
        restored from a backup), drop the cache and restart from `since=0`. A `since`
        greater than the server's `last_change_seq`, or older than the retained window,
        returns 410 `feed-window-expired`; resync the same way. `dataset_version` never
        goes backwards within one `feed_epoch`.

        **Retroactive changes.** Rows whose effect starts before the publish date (IST)
        carry `retroactive: true` and `affects_from`; re-check invoices issued on or after
        that date.
      security:
        - apiKey: [read]
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: integer, minimum: 0, format: int64 }
          example: 1840
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: A page of changes (at most 500).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoCache' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
            RateLimit-Cost: { $ref: '#/components/headers/RateLimitCost' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeFeed' }
              examples:
                supersede:
                  summary: 3004 general rule superseded and a nil-rate condition rule added (illustrative ids)
                  value:
                    since: 1840
                    next_since: 1843
                    has_more: false
                    feed_epoch: f3b9c0a1d2e4f5a6
                    current_dataset_version: '2026.10.03-1'
                    changes:
                      - seq: 1841
                        change_type: rule_end_dated
                        dataset_version: '2026.10.03-1'
                        published_at: '2026-10-03T09:15:02Z'
                        affected_prefix: '3004'
                        rule_id: rr_01H000000000000000000000B4
                        related_rule_id: null
                        effective_from: '2017-07-01'
                        effective_to: '2025-09-21'
                        retroactive: false
                        affects_from: null
                        summary: '3004 12% fixture rule end-dated 2025-09-21'
                      - seq: 1842
                        change_type: rule_added
                        dataset_version: '2026.10.03-1'
                        published_at: '2026-10-03T09:15:02Z'
                        affected_prefix: '3004'
                        rule_id: rr_01J8B0000000000000000000B5
                        related_rule_id: null
                        effective_from: '2025-09-22'
                        effective_to: null
                        retroactive: false
                        affects_from: null
                        summary: '3004 general rule 5% from 2025-09-22 (9/2025-CT(Rate), Schedule I)'
                      - seq: 1843
                        change_type: rule_added
                        dataset_version: '2026.10.03-1'
                        published_at: '2026-10-03T09:15:02Z'
                        affected_prefix: '3004'
