openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: HSN Rate API
  version: 1.1.0
  summary: HSN/SAC lookup, GST rate resolution and best-guess product classification.
  description: |
    Binding inputs: `docs/00-coordinator-decisions.md`, `00b-coordinator-rulings.md`,
    `00c-coordinator-rulings-round2.md`. Companion files: `data-model.md`, `architecture.md`.

    **What this API is.** GST rates curated from CBIC notifications, versioned by
    effective date, each with a citation (`source`) and a `verification_status`
    (`verified` | `unverified`). Seed rules are `unverified` (with `verified_by` and
    `last_verified_at` null) until a reviewer checks them against the notification PDF
    through a maker–checker `verify` proposal; rules published through maker–checker
    are `verified`. A verified rule is due for re-verification 12 months after
    `last_verified_at` (`reverify_due_at`); overdue rules carry the warning
    `verification_overdue`.

    **What this API is not.** It is not an official Government of India service and it
    is not "real-time". Rates change only when a reviewer publishes a new dataset
    version (target: within 2 business days of a CBIC notification;
    `GET /v1/meta/dataset` shows detected-but-unpublished notifications in
    `pending_notifications`). Product name / barcode → HSN is a best-guess match: every
    classification returns ranked candidates with `confidence`, `confidence_band`,
    `reasons` and `needs_review`. `high` requires an exact curated synonym on the name
    the client sent; a barcode-only request is at most `medium`. Classification never
    produces or alters a rate; rates come only from the versioned rate table.

    **Unverified rates.** Lookups and classify return unverified rules with the warning
    `rate_unverified`. `POST /v1/tax/calculate` computes tax on an unverified rule only
    when the request sets `accept_unverified: true`; otherwise that line returns
    `tax: null` with `needs_input: accept_unverified`.

    **Codes.** HSN/SAC codes are digits only, of length 2, 4, 6 or 8, or 5 for SAC
    groups in chapter 99 (e.g. `99972`).

    **Money.** All money inputs are INR amounts as JSON numbers with at most 2 decimal
    places (`multipleOf: 0.01`). The server checks this on the number's decimal string,
    not by float division; client-side validators that divide floats (e.g. ajv without
    `multipleOfPrecision: 2`) can wrongly reject values such as 2500.01. Internally they are stored as integer paise.
    Tax outputs give both rupee numbers and integer `*_paise` fields. Rates are exposed
    both as integer basis points (`*_bp`, 300 = 3%) and as a convenience percent number.
    `quantity` (> 0, ≤ 9,999,999, ≤ 3 decimals; a number or a decimal string) is informational in v1: tax is always computed on the
    line's `taxable_value`. Price-threshold rules are resolved by `unit_price`; when it
    is absent and `quantity` is given, the unit price used for rule selection is
    roundHalfUp(taxable_paise × 1000 / qty_milli).

    **Dates.** `YYYY-MM-DD` dates are interpreted in Asia/Kolkata (IST). When `date` is
    omitted, "today" is the current IST date. Timestamps are RFC 3339 UTC.

    **Caching (one table, same as TRD §11 and best-practices §7).**

    | Route | ETag | Cache-Control |
    |---|---|---|
    | `GET /v1/hsn/{code}`, `GET /v1/hsn/search` | yes | `private, max-age=<min(3600, seconds to next IST midnight)>, must-revalidate` |
    | `GET /v1/rates/changes`, `GET /v1/meta/dataset` | yes | `private, no-cache` |
    | `POST /v1/classify`, `POST /v1/tax/calculate`, all `/v1/admin/*`, `/healthz`, `/readyz` | no | `no-store` |

    The ETag is `W/"ds-<dataset_version>-<16 hex>"`, where the hex is the first 16
    characters of sha256 over (dataset_version, resolved as-of date in IST, response
    body). It therefore changes at IST midnight when a pre-loaded rule takes effect,
    and `max-age` never extends past the next IST midnight. Send it back in
    `If-None-Match` to get `304 Not Modified`. Use `GET /v1/rates/changes` to keep a
    local cache fresh (poll every 15 min with `If-None-Match`).

    **Errors.** All errors are RFC 9457 `application/problem+json`: a kebab-case `type`
    URI, `title`, `status`, `detail`, `instance` (the request path), `request_id` (the
    server's `req_` ULID, always) and `client_request_id` (the client's `X-Request-Id`
    when it was sent and valid). `detail` may echo validated-format values (digit-only
    codes that matched the pattern, ids) but never free text such as `name` or `q`, and never a GTIN that failed its check digit.
    A known path with the wrong method returns `405 method-not-allowed` with an
    `Allow` header (GET implies HEAD); an unknown path returns `404 not-found`.

    **Rate limits (counted in tokens).** One token bucket per key, refilled at
    `rate_limit_per_min`/60 tokens per second (default 600/min = 10/s), with a burst
    capacity of ceil(`rate_limit_per_min`/6) tokens (default 100). Costs:
    `POST /v1/classify` 5; `POST /v1/tax/calculate` 1 + floor(lines/50); every other
    request 1. Every authenticated response carries `RateLimit-Limit` (tokens per
    minute, default 600), `RateLimit-Remaining` (tokens left in the bucket after this
    request, floored), `RateLimit-Reset` (seconds until the bucket is full again),
    `RateLimit-Cost` (tokens this request cost) and `RateLimit-Policy`
    (e.g. `600;w=60;burst=100`); a `429` additionally carries `Retry-After`.

    **Body limits.** 64 KiB on every route except `POST /v1/classify` (16 KiB) and
    `POST /v1/tax/calculate` (256 KiB, because 500 fully populated lines are about
    55 KB; coordinator decision recorded in 00b).

    **Admin plane.** `/v1/admin/*` is served only on the admin listener
    (`HSN_ADMIN_HOST`:`HSN_ADMIN_PORT`, default `127.0.0.1:3001`), never on the public
    listener; the public listener returns 404 for those paths. Every admin write
    requires an `Idempotency-Key` header (a UUID; missing → 400
    `idempotency-key-required`, ruling 28); a replay returns the stored response with
    `Idempotent-Replayed: true`. The admin listener also serves a minimal Prometheus
    `GET /metrics` (counts and timestamps only; no key needed, `HSN_ADMIN_IP_ALLOWLIST`
    applies; ruling 30); it is not part of this API description. v1 has no out-of-band
    admin notifier (deferred to Later, ruling 29): admin writes are recorded in the
    audit log and logged; an approved `admin_grant` logs at warn level with
    `alert: true`.

    Example citations, dates, ids, hashes, signal values and verification states in
    this document are **illustrative** of the data shape (all seed data is currently
    `unverified`); the authoritative citation is always the one returned at runtime.
    The only real source URL used in examples is the CBIC PDF of 9/2025-CT(Rate)
    (research/sources.md); `https://taxinformation.cbic.gov.in/view-pdf/<id>` is a
    placeholder for notifications whose CBIC PDF link is not in the research.
  contact:
    name: HSN Rate API owner (Amit)
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.hsn-api.example
    description: Production public listener (placeholder host)
  - url: http://localhost:3000
    description: Local development, public listener
security:
  - apiKey: [read]
tags:
  - name: hsn
    description: HSN/SAC master data and rate rules
  - name: classify
    description: Best-guess product → HSN classification
  - name: tax
    description: GST amount calculation from published rates
  - name: rates
    description: Change feed for cache refresh
  - name: meta
    description: Dataset metadata and health
  - name: admin
    description: Maker–checker rate and reference-data maintenance and audit (admin scope, admin listener only)

paths:
  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
              example: { status: ok }

  /readyz:
    get:
      tags: [meta]
      operationId: readyz
      summary: Readiness probe
      description: |
        Checks (server-side): DB open, migrations at head, FTS5 available, dataset state
        present and the current version sealed, `audit_integrity` (at boot the whole
        HMAC chain is verified and the state-to-audit cross-check run, round 4
        SA-C2-02) and `state_continuity` (no unacknowledged restore: the database is
        not behind the MAC'd high-water mark in `HSN_STATE_HWM_FILE`, SA-C2-06, and the
        sidecar is not missing for a database that had one, SA-C3-04; after a detected
        restore it stays 503 until `npm run ack-restore` and a restart).
        Publicly it returns only `{status}`; which check failed goes to the server log,
        never to the response (SA-D-25, SEC-73).
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ready }
              example: { status: ready }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/hsn/{code}:
    get:
      tags: [hsn]
      operationId: getHsn
      summary: HSN/SAC detail with applicable rate rules
      description: |
        Returns the HSN/SAC entry, its ancestry, and the rate resolution on `date`
        (default: today IST). Rules are chosen by longest matching HSN prefix among
        active (not voided) rules in force on that date. `rate.coverage` is always
        present: `ok` (one applicable rule), `ambiguous` (several rules remain;
        `applicable_rule` is null and `rules` lists them with their condition text) or
        `no_rate_rule` (the code exists but has no curated rule). When the ambiguity is
        a general rule plus condition rules (e.g. 3004 and the nil-rate drug list),
        `default_rule_id` names the general rule; the API still does not pick it for you.

        **Codes outside the HSN master (round 5, R3).** A well-formed code that is not
        in the master but has a known ancestor (6, then 5 for SAC 99xxx, then 4, then 2
        digits) returns 200, resolved against that ancestor: `code_in_master: false`,
        `resolved_via: "<parent>"`, the warning `code_not_in_master`, and a description
        saying so. Only a code whose chapter does not exist returns 404 `hsn-not-found`.
      security:
        - apiKey: [read]
      parameters:
        - $ref: '#/components/parameters/HsnCode'
        - $ref: '#/components/parameters/AsOfDate'
        - $ref: '#/components/parameters/UnitPrice'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: HSN detail.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlLookup' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
            RateLimit-Cost: { $ref: '#/components/headers/RateLimitCost' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HsnDetail' }
              examples:
                goldJewellery:
                  summary: "7113 on 2026-10-11: 3%, unverified seed rule with citation_note (live output, quick-start seed, 2026-10-11)"
