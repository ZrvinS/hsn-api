  /v1/classify:
    post:
      tags: [classify]
      operationId: classify
      summary: Best-guess HSN candidates for a product name and/or barcode
      description: |
        Pipeline: barcode → GTIN checksum → local product cache → external product
        adapters (only if configured, within the key's daily outbound cap, the per-host
        budget and the global queue limit) → name classifier (synonyms + FTS5 + score
        fusion, `classifier.version` `rules-fts-2.3`, architecture.md §5.4). If `name` is
        sent, all text signals use it and a barcode contributes only the category signal.
        If only `barcode` is sent, the text is external product data and every candidate
        is capped at `medium` with a `review_hint` reason naming the crowd-edited source. `product.source` is `not_found` when the product is
        unknown and `lookup_failed` when the lookup errored or was refused by a budget
        (this does not mean the product is missing); errors are cached briefly, never as
        "not found".

        Confidence: weights are renormalised over the signals applicable to the request.
        `high` (≥ 0.85) requires an exact curated synonym on the name the client sent;
        since `rules-fts-2.1` (validator R2) a synonym is exact only when it is the whole
        name: after removing its tokens nothing may remain except quantities (a number,
        optionally with an allow-listed unit such as g, kg, mg, ml, l, cm, pcs, x, mah, gb,
        or a karat value; `rules-fts-2.2`), pack words, dosage forms and function words.
        Brand words from a barcode lookup never count (`rules-fts-2.2`, SA-K3-01). A phrase inside a longer name scores 0.7 (at most medium), a one-word
        phrase inside a longer name 0.3, and single generic words (tablet, shirt,
        chocolate, ring, chain, oil, …) are never exact. Imitation-jewellery qualifiers
        (plated, imitation, artificial, brass, "one gram", …) move jewellery evidence
        from 7113 to 7117 and lower other Chapter 71 evidence. An accessory word that
        follows a candidate's evidence ("mobile phone stand", "tv wall mount") caps that
        candidate at 0.45 with a review hint unless the word is its own evidence ("phone
        charger" keeps 8504), and packaging words ("gift box", "hamper") keep the contents'
        candidates with a review hint (`rules-fts-2.3`). Otherwise the cap is 0.84 (no separate reason code; the cap shows as `confidence`
        below the score recomputed from `signals`). If the top two
        differ by less than 0.10, the top is capped at `medium` (reason
        `close_runner_up`). Candidates below 0.10 are dropped. If the best remaining
        candidate is below 0.30, the rest are still returned, all band `low`, with a
        `message`. An empty candidate list (a valid 200 with `needs_review: true` and a
        `message`) happens only when nothing reaches 0.10.

        Optional LLM re-ranker (off by default): runs only when the server has one
        configured, the request sends `allow_llm: true`, the key is not `llm_opt_out`,
        the per-key and global LLM budgets are not spent, and the deterministic top is
        not already `high`. It may only reorder the retrieved candidates; confidence may
        only go down. It never adds a code or touches a rate. `llm_used` reports whether
        it ran.

        **Order.** `candidates` is ordered by rank (after any re-rank); confidences are
        non-increasing down the list. `scoring` reports which signals counted and the
        denominator, so every confidence can be recomputed by hand.

        Each candidate carries its rate resolution (same shape as `GET /v1/hsn/{code}`).
        If an exact curated synonym on the caller's `name` carries a `rule_hint` (a
        rule `condition_code`, e.g. `nil_rate_list` for a named nil-rated drug) and the
        resolution is ambiguous with exactly one rule of that code, that rule is selected
        (`coverage: ok`, warning `selected_by_hint`) and the candidate carries
        `rule_hint`. Hints never come from external product data.
      security:
        - apiKey: [classify]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassifyRequest' }
            examples:
              goldRing:
                summary: Jewellery item by name with price
                value: { name: '22K gold ring', unit_price: 68500.00 }
              paracetamol:
                summary: Medicine by name
                value: { name: 'Paracetamol 500 mg tablet' }
              barcodeOnly:
                summary: Packaged food by GTIN-13 barcode only
                value: { barcode: '8901234012345' }
              nameAndBarcode:
                summary: Name plus barcode
                value: { name: 'Glucose biscuits', barcode: '8901234012345' }
              weak:
                summary: No synonym, weak text match
                value: { name: 'Mobile phone stand' }
      responses:
        '200':
          description: Ranked candidates.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
            RateLimit-Cost: { $ref: '#/components/headers/RateLimitCost' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
