  /v1/hsn/search:
    get:
      tags: [hsn]
      operationId: searchHsn
      summary: Full-text search over HSN/SAC descriptions
      description: |
        FTS5 (bm25) search over official descriptions plus curated keywords. This is a
        text search, not a classification: results carry a relevance `score` but no
        `confidence`. Use `POST /v1/classify` for product → HSN suggestions. A query
        that sanitises to zero tokens returns an empty result (never an FTS error).
        Route `/v1/hsn/search` takes precedence over `/v1/hsn/{code}`; `code` is
        digits only, so there is no collision.
      security:
        - apiKey: [read]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
          example: gold jewellery
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: type
          in: query
          schema: { type: string, enum: [goods, service] }
        - name: level
          in: query
          description: Restrict to codes of this digit length (5 = SAC groups, chapter 99 only).
          schema: { type: integer, enum: [2, 4, 5, 6, 8] }
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Search results ordered by relevance.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlLookup' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
            RateLimit-Cost: { $ref: '#/components/headers/RateLimitCost' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
              example:
                query: gold jewellery
                results:
                  - { code: '7113', level: 4, type: goods, chapter: '71', description: 'Articles of jewellery and parts thereof, of precious metal or of metal clad with precious metal', score: 1.0, highlight: 'Articles of [jewellery] and parts thereof, of precious metal…' }
                  - { code: '71131910', level: 8, type: goods, chapter: '71', description: 'Articles of jewellery of gold, unstudded', score: 0.93, highlight: 'Articles of [jewellery] of [gold], unstudded' }
                  - { code: '7117', level: 4, type: goods, chapter: '71', description: 'Imitation jewellery', score: 0.61, highlight: 'Imitation [jewellery]' }
